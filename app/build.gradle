import javax.inject.Inject
import org.gradle.process.ExecOperations

plugins {
    id 'application'
}

description = 'Test application for developing and running JavaToGpu kernels.'

// Плагин из соседнего gradle-plugin ещё не собран при конфигурации этой сборки.
// Используем те же frontend и weaver напрямую, без публикации библиотек.
sourceSets {
    buildTools
}

dependencies {
    implementation project(':api')
    implementation project(':runtime')
    annotationProcessor project(':frontend-java')
    testAnnotationProcessor project(':frontend-java')

    buildToolsImplementation project(':weaver')
    testImplementation project(':test-support')
    testImplementation testFixtures(project(':runtime'))
}

application {
    mainClass = 'com.sixik.gpu.app.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

apply from: rootProject.file('gradle/jmh.gradle')

tasks.named('jmh') {
    // Относительные пути результатов JMH разрешаются от корня репозитория.
    workingDir rootProject.projectDir
    // JMH наследует аргументы JVM запускающего процесса в fork-процессы.
    // Используем тот же параметр runtime, что и пример Main.
    def dumpOption = providers.gradleProperty('dumpOpencl')
            .orElse(providers.systemProperty('javatogpu.dump'))
    if (dumpOption.isPresent()) {
        def value = dumpOption.get().trim()
        def setting
        switch (value.toLowerCase(Locale.ROOT)) {
            case ['', 'true', '1', 'yes']:
                setting = layout.buildDirectory.dir('opencl/jmh').get().asFile.absolutePath
                break
            case ['off', 'false', '0', 'no']:
                setting = 'off'
                break
            default:
                setting = rootProject.file(value).absolutePath
        }
        systemProperty 'javatogpu.dump', setting
    }
}

tasks.register('terrainSweep', JavaExec) {
    group = 'verification'
    description = 'A single generation of the full 65x65 chunk window; an extra scale check next to JMH.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'com.sixik.gpu.app.terrain.TerrainSweep'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Xmx2g'
    if (findProperty('terrainSampling') != null) {
        args findProperty('terrainSampling').toString()
    }
}

// Weaver собран на Java 25: запускаем его через toolchain, даже если Gradle работает на Java 21.
abstract class WeavingServices {
    @Inject
    abstract ExecOperations getExecOperations()
}

def weavingServices = objects.newInstance(WeavingServices)
def weavingClasspath = sourceSets.buildTools.runtimeClasspath
def weavingLauncher = javaToolchains.launcherFor(java.toolchain)

['compileJava', 'compileTestJava'].each { taskName ->
    tasks.named(taskName, JavaCompile) {
        dependsOn tasks.named('buildToolsClasses')
        inputs.files(weavingClasspath).withPropertyName('weavingClasspath').withNormalizer(ClasspathNormalizer)
        options.compilerArgs += ['-Xlint:-processing']
        // Подмена внутри compile-задачи: up-to-date и build cache хранят готовые классы.
        doLast {
            def classesDirectory = destinationDirectory.get().asFile.absolutePath
            weavingServices.execOperations.javaexec {
                executable = weavingLauncher.get().executablePath.asFile.absolutePath
                classpath = weavingClasspath
                mainClass = 'com.sixik.gpu.app.buildtools.Weave'
                args classesDirectory
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'device'
    }
}

tasks.register('deviceTest', Test) {
    group = 'verification'
    description = 'Checks the application kernels against a real OpenCL device; skipped without a device.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'device'
    }
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}
