description = 'Java frontend: an annotation processor on the javac Tree API, writes IR.'

dependencies {
    implementation project(':api')
    implementation project(':ir')
    // распознавание шаблона @Reduction - тот же код, которым рантайм строит параллельное ядро
    implementation project(':ir-optimizer')

    // Эталонные модули IR (Fixtures) для сравнения вывода фронтенда с модулями, собранными вручную.
    testImplementation testFixtures(project(':ir'))
    // Текстовый дамп IR для golden-тестов. Только тесты: в production-артефакт tools не входит.
    testImplementation project(':tools')
    // свёртки (@Reduction): построенное ядро исполняется интерпретатором и сверяется с эталоном
    testImplementation project(':ir-interpreter')
}

// Таблица диагностик GPU#### лежит в корне репозитория (diagnostics/diagnostics.def) и упаковывается как ресурс модуля:
// это данные, общие для будущих фронтендов (REWORK_ARCHITECTURE.md, 3.3).
processResources {
    from(rootProject.file('diagnostics')) {
        include 'diagnostics.def'
        into 'com/sixik/gpu/frontend/java'
    }
}

tasks.named('test') {
    inputs.dir(rootProject.file('diagnostics')).withPropertyName('diagnostics')
    // Тесты компилируют образцы javac in-process: classpath задаём явно, а не полагаемся на java.class.path воркера.
    systemProperty 'gpu.test.classpath', sourceSets.test.runtimeClasspath.asPath
    // Исходники фронтенда: тест сверяет коды GPU#### в коде с таблицей диагностик.
    systemProperty 'frontend.src', file('src/main/java').absolutePath
}
