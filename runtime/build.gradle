plugins {
    // Фейковый DeviceApi (тесты без железа) переиспользуют test-support и E2E-тесты weaver/плагина.
    id 'java-test-fixtures'
}

description = 'GpuContext, devices (FFM to libOpenCL), GpuBuffer, cache, launch, JVM fallback.'

dependencies {
    api project(':api')
    api project(':ir')
    api project(':codegen-opencl')

    // Только тесты (production-граф проверяет verifyModuleBoundaries и этих связей не видит):
    //  * фикстуры ir - модули, собранные вручную; ir-interpreter и его образцы - эталон для device-теста.
    testImplementation testFixtures(project(':ir'))
    testImplementation project(':ir-interpreter')
    testImplementation testFixtures(project(':ir-interpreter'))
    testFixturesApi project(':ir')

    // E2E фасада: исходник -> javac с процессором frontend-java -> weaver -> загрузка класса -> обычный вызов.
    testImplementation project(':frontend-java')
    testImplementation project(':weaver')
    testImplementation testFixtures(project(':weaver'))
}

// JMH: накладные расходы подготовленного и обычного запуска на фейковом устройстве (без драйвера) и на реальном, если он есть.
apply from: rootProject.file('gradle/jmh.gradle')

dependencies {
    jmhImplementation sourceSets.testFixtures.output
    jmhImplementation testFixtures(project(':ir'))
}

tasks.named('test') {
    // KernelCompiler компилирует образцы javac in-process: classpath задаём явно, а не полагаемся на java.class.path воркера.
    systemProperty 'gpu.test.classpath', sourceSets.test.runtimeClasspath.asPath
    useJUnitPlatform {
        excludeTags 'device' // тесты на реальном драйвере - отдельной задачей deviceTest
    }
}

// Тесты на настоящем OpenCL-устройстве. Без драйвера пропускаются (Assumptions), в обычную сборку не входят.
tasks.register('deviceTest', Test) {
    group = 'verification'
    description = 'Runtime tests on a real OpenCL device (tag device).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'gpu.test.classpath', sourceSets.test.runtimeClasspath.asPath
    useJUnitPlatform {
        includeTags 'device'
    }
    testLogging {
        showStandardStreams = true
    }
    shouldRunAfter tasks.named('test')
}
