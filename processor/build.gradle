tasks.register('writeOpenClI3ReadinessWorkloadBaseline') {
    group = 'verification'
    description = 'Persists the current OpenCL I3 workload readiness summary as a comparison baseline.'
    dependsOn 'openClValidationReport'
    inputs.file(openClI3ReadinessWorkloadSummaryFile)
    outputs.file(openClI3ReadinessBaselineFile)

    doLast {
        if (!openClI3ReadinessWorkloadSummaryFile.isFile()) {
            throw new GradleException('Missing OpenCL I3 readiness workload summary: ' + openClI3ReadinessWorkloadSummaryFile)
        }
        File baselineFile = openClI3ReadinessBaselineFile.get()
        baselineFile.parentFile.mkdirs()
        Properties current = loadPropertiesFile(openClI3ReadinessWorkloadSummaryFile)
        Properties baseline = openClI3ReadinessBaseline(current)
        baselineFile.withOutputStream { stream ->
            baseline.store(stream, 'JavaToGpu OpenCL I3 readiness workload baseline')
        }
        logger.lifecycle('OpenCL I3 readiness baseline written: {} kernels, status={}, reviewReady={}, blocked={} -> {}',
                baseline.getProperty('kernel.count'),
                baseline.getProperty('status'),
                baseline.getProperty('reviewReady.count'),
                baseline.getProperty('blocked.count'),
                baselineFile)
    }
}

tasks.register('validateOpenClI3ReadinessWorkloadBaseline') {
    group = 'verification'
    description = 'Compares current OpenCL I3 workload readiness summary against a persisted baseline.'
    dependsOn 'openClValidationReport'
    mustRunAfter 'writeOpenClI3ReadinessWorkloadBaseline'
    inputs.file(openClI3ReadinessWorkloadSummaryFile)
    inputs.file(openClI3ReadinessBaselineFile)

    doLast {
        File baselineFile = openClI3ReadinessBaselineFile.get()
        if (!baselineFile.isFile()) {
            throw new GradleException('Missing OpenCL I3 readiness baseline: ' + baselineFile
                    + '. Run writeOpenClI3ReadinessWorkloadBaseline first or pass -Pjavatogpu.opencl.i3ReadinessBaselineFile=<file>.')
        }
        if (!openClI3ReadinessWorkloadSummaryFile.isFile()) {
            throw new GradleException('Missing OpenCL I3 readiness workload summary: ' + openClI3ReadinessWorkloadSummaryFile)
        }
        Properties baseline = loadPropertiesFile(baselineFile)
        Properties current = loadPropertiesFile(openClI3ReadinessWorkloadSummaryFile)
        validateOpenClI3ReadinessBaseline(baseline, current, baselineFile)
        logger.lifecycle('OpenCL I3 readiness baseline OK: status={}, kernels={}, reviewReady={}, blocked={}, productionEnabled={}',
                current.getProperty('status'),
                current.getProperty('kernel.count'),
                current.getProperty('reviewReady.count'),
                current.getProperty('blocked.count'),
                current.getProperty('productionEnabled.count'))
    }
}

tasks.register('validateOpenClI3ReadinessBaselineContract') {
    group = 'verification'
    description = 'Self-tests OpenCL I3 readiness baseline regression and progress comparisons.'

    doLast {
        Properties baseline = new Properties()
        baseline.setProperty('format', 'javatogpu.opencl.i3-readiness-baseline.v1')
        baseline.setProperty('status', 'blocked')
        baseline.setProperty('kernel.count', '2')
        baseline.setProperty('reviewReady.count', '1')
        baseline.setProperty('blocked.count', '1')
        baseline.setProperty('productionEnabled.count', '0')
        baseline.setProperty('productionMutationEnabled', 'false')
        baseline.setProperty('kernel.0.resource', 'kernel-a.cl')
        baseline.setProperty('kernel.0.i3Status', 'review-ready')
        baseline.setProperty('kernel.0.runtimeIr', 'optimized')
        baseline.setProperty('kernel.1.resource', 'kernel-b.cl')
        baseline.setProperty('kernel.1.i3Status', 'blocked')
        baseline.setProperty('kernel.1.runtimeIr', 'original')

        Properties equalCurrent = new Properties()
        equalCurrent.putAll(baseline)
        validateOpenClI3ReadinessBaseline(baseline, equalCurrent, new File('synthetic-i3-baseline.properties'))

        Properties progressCurrent = new Properties()
        progressCurrent.putAll(baseline)
        progressCurrent.setProperty('reviewReady.count', '2')
        progressCurrent.setProperty('blocked.count', '0')
        progressCurrent.setProperty('kernel.1.i3Status', 'review-ready')
        validateOpenClI3ReadinessBaseline(baseline, progressCurrent, new File('synthetic-i3-baseline.properties'))

        Properties regressionCurrent = new Properties()
        regressionCurrent.putAll(baseline)
        regressionCurrent.setProperty('reviewReady.count', '0')
        regressionCurrent.setProperty('blocked.count', '2')
        regressionCurrent.setProperty('kernel.0.i3Status', 'blocked')
        expectOpenClI3ReadinessBaselineFailure(baseline, regressionCurrent, 'review-ready regression')

        Properties mutationCurrent = new Properties()
        mutationCurrent.putAll(baseline)
        mutationCurrent.setProperty('productionMutationEnabled', 'true')
        expectOpenClI3ReadinessBaselineFailure(baseline, mutationCurrent, 'unexpected production mutation')

        logger.lifecycle('OpenCL I3 readiness baseline contract self-test OK')
    }
}

tasks.register('writeOpenClBackendSourcePromotionWorkloadBaseline') {
    group = 'verification'
    description = 'Persists the current OpenCL backend source-promotion workload gate as a comparison baseline.'
    dependsOn 'openClValidationReport'
    inputs.file(openClBackendSourcePromotionWorkloadGateFile)
    outputs.file(openClBackendSourcePromotionWorkloadBaselineFile)

    doLast {
        if (!openClBackendSourcePromotionWorkloadGateFile.isFile()) {
            throw new GradleException('Missing OpenCL backend source-promotion workload gate: ' + openClBackendSourcePromotionWorkloadGateFile)
        }
        File baselineFile = openClBackendSourcePromotionWorkloadBaselineFile.get()
        baselineFile.parentFile.mkdirs()
        Properties current = loadPropertiesFile(openClBackendSourcePromotionWorkloadGateFile)
        Properties baseline = openClBackendSourcePromotionWorkloadBaseline(current)
        baselineFile.withOutputStream { stream ->
            baseline.store(stream, 'JavaToGpu OpenCL backend source-promotion workload baseline')
        }
        logger.lifecycle('OpenCL backend source-promotion workload baseline written: {} kernels, status={}, reviewReady={} -> {}',
                baseline.getProperty('kernel.count'),
                baseline.getProperty('status'),
                baseline.getProperty('reviewReady'),
                baselineFile)
    }
}

tasks.register('validateOpenClBackendSourcePromotionWorkloadBaseline') {
    group = 'verification'
    description = 'Compares current OpenCL backend source-promotion workload gate against a persisted baseline.'
    dependsOn 'openClValidationReport'
    mustRunAfter 'writeOpenClBackendSourcePromotionWorkloadBaseline'
    inputs.file(openClBackendSourcePromotionWorkloadGateFile)
    inputs.file(openClBackendSourcePromotionWorkloadBaselineFile)

    doLast {
        File baselineFile = openClBackendSourcePromotionWorkloadBaselineFile.get()
        if (!baselineFile.isFile()) {
            throw new GradleException('Missing OpenCL backend source-promotion workload baseline: ' + baselineFile
                    + '. Run writeOpenClBackendSourcePromotionWorkloadBaseline first or pass -Pjavatogpu.opencl.backendSourcePromotionWorkloadBaselineFile=<file>.')
        }
        if (!openClBackendSourcePromotionWorkloadGateFile.isFile()) {
            throw new GradleException('Missing OpenCL backend source-promotion workload gate: ' + openClBackendSourcePromotionWorkloadGateFile)
        }
        Properties baseline = loadPropertiesFile(baselineFile)
        Properties current = loadPropertiesFile(openClBackendSourcePromotionWorkloadGateFile)
        validateOpenClBackendSourcePromotionWorkloadBaseline(baseline, current, baselineFile)
        logger.lifecycle('OpenCL backend source-promotion workload baseline OK: status={}, kernels={}, reviewReady={}, parity={}, runtimeEquivalence={}',
                current.getProperty('status'),
                current.getProperty('kernel.count'),
                current.getProperty('reviewReady'),
                current.getProperty('sourceParityMatched'),
                current.getProperty('runtimeEquivalencePassed'))
    }
}

tasks.register('validateOpenClBackendSourcePromotionWorkloadBaselineContract') {
    group = 'verification'
    description = 'Self-tests OpenCL backend source-promotion workload baseline regression and progress comparisons.'

    doLast {
        Properties baseline = new Properties()
        baseline.setProperty('format', 'javatogpu.opencl.backend-source-promotion-workload-baseline.v1')
        baseline.setProperty('status', 'blocked')
        baseline.setProperty('kernel.count', '2')
        baseline.setProperty('reviewReady', 'false')
        baseline.setProperty('sourceParityMatched', 'true')
        baseline.setProperty('runtimeEquivalencePassed', 'true')
        baseline.setProperty('productionSourceSwitching', 'false')
        baseline.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.count', '2')
        baseline.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.0.name', 'runtime-equivalence')
        baseline.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.0.count', '1')
        baseline.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.1.name', 'source-parity')
        baseline.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.1.count', '1')
        baseline.setProperty('kernel.0.sourceKernelResource', 'kernel-a.cl')
        baseline.setProperty('kernel.0.status', 'review-ready')
        baseline.setProperty('kernel.0.reviewReady', 'true')
        baseline.setProperty('kernel.0.sourceParityMatched', 'true')
        baseline.setProperty('kernel.0.runtimeEquivalencePassed', 'true')
        baseline.setProperty('kernel.0.sourceSwitching.sourcePromotionFirstBlocker', 'none')
        baseline.setProperty('kernel.1.sourceKernelResource', 'kernel-b.cl')
        baseline.setProperty('kernel.1.status', 'blocked')
        baseline.setProperty('kernel.1.reviewReady', 'false')
        baseline.setProperty('kernel.1.sourceParityMatched', 'true')
        baseline.setProperty('kernel.1.runtimeEquivalencePassed', 'true')
        baseline.setProperty('kernel.1.sourceSwitching.sourcePromotionFirstBlocker', 'runtime equivalence must execute and pass before backend source promotion')

        Properties equalCurrent = new Properties()
        equalCurrent.putAll(baseline)
        validateOpenClBackendSourcePromotionWorkloadBaseline(baseline, equalCurrent, new File('synthetic-source-promotion-workload-baseline.properties'))

        Properties progressCurrent = new Properties()
        progressCurrent.putAll(baseline)
        progressCurrent.setProperty('status', 'review-ready')
        progressCurrent.setProperty('reviewReady', 'true')
        progressCurrent.setProperty('kernel.1.status', 'review-ready')
        progressCurrent.setProperty('kernel.1.reviewReady', 'true')
        progressCurrent.setProperty('kernel.1.sourceSwitching.sourcePromotionFirstBlocker', 'none')
        progressCurrent.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.0.count', '0')
        progressCurrent.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.1.count', '0')
        validateOpenClBackendSourcePromotionWorkloadBaseline(baseline, progressCurrent, new File('synthetic-source-promotion-workload-baseline.properties'))

        Properties statusRegression = new Properties()
        statusRegression.putAll(baseline)
        statusRegression.setProperty('kernel.0.status', 'blocked')
        expectOpenClBackendSourcePromotionWorkloadBaselineFailure(baseline, statusRegression, 'kernel status regression')

        Properties booleanRegression = new Properties()
        booleanRegression.putAll(baseline)
        booleanRegression.setProperty('sourceParityMatched', 'false')
        expectOpenClBackendSourcePromotionWorkloadBaselineFailure(baseline, booleanRegression, 'source parity boolean regression')

        Properties blockerRegression = new Properties()
        blockerRegression.putAll(baseline)
        blockerRegression.setProperty('sourceSwitching.sourcePromotionFirstBlockerFamily.0.count', '2')
        expectOpenClBackendSourcePromotionWorkloadBaselineFailure(baseline, blockerRegression, 'blocker family regression')

        Properties productionSwitching = new Properties()
        productionSwitching.putAll(baseline)
        productionSwitching.setProperty('productionSourceSwitching', 'enabled')
        expectOpenClBackendSourcePromotionWorkloadBaselineFailure(baseline, productionSwitching, 'unexpected production source switching')

        logger.lifecycle('OpenCL backend source-promotion workload baseline contract self-test OK')
    }
}

