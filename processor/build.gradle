private static Properties loadPropertiesFile(File file) {
    Properties properties = new Properties()
    file.withInputStream { stream -> properties.load(stream) }
    return properties
}

private static void validateCudaSmokeSummaryGate(File summaryFile, String expectedTaskName, String expectedOutputFormat) {
    if (summaryFile == null || !summaryFile.isFile()) {
        throw new GradleException('Missing CUDA smoke summary: ' + summaryFile)
    }
    Properties summary = loadPropertiesFile(summaryFile)
    if (summary.getProperty('format') != 'javatogpu.cuda-smoke-summary.v1') {
        throw new GradleException('CUDA smoke summary has an unsupported format in ' + summaryFile)
    }
    String taskName = summary.getProperty('taskName', 'unknown')
    if (expectedTaskName != null && !expectedTaskName.isBlank() && taskName != expectedTaskName) {
        throw new GradleException('CUDA smoke summary task drifted from ' + expectedTaskName + ' to ' + taskName)
    }
    String outputFormat = summary.getProperty('nvcc.outputFormat', 'ptx')
    String expectedFormat = expectedOutputFormat == null || expectedOutputFormat.isBlank() ? 'ptx' : expectedOutputFormat
    if (outputFormat != expectedFormat) {
        throw new GradleException('CUDA smoke summary output format drifted from ' + expectedFormat + ' to ' + outputFormat)
    }

    String status = summary.getProperty('status', 'unknown')
    boolean required = Boolean.parseBoolean(summary.getProperty('required', 'false'))
    boolean richEvidence = Boolean.parseBoolean(summary.getProperty('realDriverExecutionEvidence.rich', 'false'))
    int executedCount = parseCudaSmokeInt(summary.getProperty('test.executed.count'))
    int realDriverCount = parseCudaSmokeInt(summary.getProperty('evidence.realDriver.count'))
    int evidenceCount = parseCudaSmokeInt(summary.getProperty('evidence.count'))
    String firstBlocker = summary.getProperty('firstBlocker', 'none')

    if (status == 'failed') {
        throw new GradleException('CUDA smoke summary reports failed status for ' + taskName + ': ' + firstBlocker)
    }
    if (required && status != 'passed') {
        throw new GradleException('Required CUDA smoke did not pass for ' + taskName + ': status=' + status
                + ', firstBlocker=' + firstBlocker)
    }
    if (status == 'passed' && executedCount <= 0) {
        throw new GradleException('CUDA smoke summary passed without executed tests for ' + taskName)
    }
    if (status == 'passed' && !richEvidence) {
        throw new GradleException('CUDA smoke summary passed without rich real-driver evidence for ' + taskName
                + ': evidence.realDriver.count=' + realDriverCount
                + ', evidence.count=' + evidenceCount
                + ', executed=' + executedCount)
    }
    if (status == 'passed' && realDriverCount < executedCount) {
        throw new GradleException('CUDA smoke summary has incomplete real-driver evidence for ' + taskName
                + ': evidence.realDriver.count=' + realDriverCount
                + ', executed=' + executedCount)
    }
    if (required && !richEvidence) {
        throw new GradleException('Required CUDA smoke lacks rich real-driver evidence for ' + taskName
                + ': status=' + status
                + ', firstBlocker=' + firstBlocker)
    }
}

private static Properties cudaSmokeSummary(
        File resultsDirectory,
        String required,
        String nvccPath,
        String smokeArch,
        String nvccOutputFormat,
        String taskName
) {
    Properties summary = new Properties()
    summary.setProperty('format', 'javatogpu.cuda-smoke-summary.v1')
    summary.setProperty('taskName', taskName == null || taskName.isBlank() ? 'integrationCudaSmokeTest' : taskName)
    summary.setProperty('generatedAtUtc', Instant.now().toString())
    summary.setProperty('required', required)
    summary.setProperty('nvcc.path', nvccPath == null || nvccPath.isBlank() ? 'nvcc' : nvccPath)
    summary.setProperty('smoke.arch', smokeArch == null || smokeArch.isBlank() ? 'auto' : smokeArch)
    summary.setProperty('nvcc.outputFormat', nvccOutputFormat == null || nvccOutputFormat.isBlank() ? 'ptx' : nvccOutputFormat)
    summary.setProperty('junit.results.directory', resultsDirectory.absolutePath)

    File[] reportFiles = resultsDirectory.isDirectory()
            ? resultsDirectory.listFiles({ File ignored, String name -> name.endsWith('.xml') } as FilenameFilter)
            : null
    List<File> reports = reportFiles == null ? List.of() : reportFiles.toList().sort { it.name }
    summary.setProperty('junit.results.present', Boolean.toString(!reports.isEmpty()))

    int testCount = 0
    int skippedCount = 0
    int failureCount = 0
    int errorCount = 0
    LinkedHashSet<String> blockers = new LinkedHashSet<>()
    List<Map<String, String>> evidenceRows = new ArrayList<>()
    for (File report : reports) {
        def suite = new XmlSlurper(false, false).parse(report)
        testCount += parseCudaSmokeInt(suite.@tests.text())
        skippedCount += parseCudaSmokeInt(suite.@skipped.text())
        failureCount += parseCudaSmokeInt(suite.@failures.text())
        errorCount += parseCudaSmokeInt(suite.@errors.text())
        collectCudaSmokeEvidence(suite.'system-out'.text(), evidenceRows)
        collectCudaSmokeEvidence(suite.'system-err'.text(), evidenceRows)
        suite.testcase.each { testcase ->
            collectCudaSmokeBlockers(testcase.skipped.@message.text(), blockers)
            collectCudaSmokeBlockers(testcase.skipped.text(), blockers)
            collectCudaSmokeBlockers(testcase.failure.@message.text(), blockers)
            collectCudaSmokeBlockers(testcase.failure.text(), blockers)
            collectCudaSmokeBlockers(testcase.error.@message.text(), blockers)
            collectCudaSmokeBlockers(testcase.error.text(), blockers)
            collectCudaSmokeEvidence(testcase.'system-out'.text(), evidenceRows)
            collectCudaSmokeEvidence(testcase.'system-err'.text(), evidenceRows)
        }
    }
    if (reports.isEmpty()) {
        blockers.add('junit-results-missing')
    }

    int failedCount = failureCount + errorCount
    int executedCount = Math.max(0, testCount - skippedCount)
    String status = failedCount > 0
            ? 'failed'
            : (testCount == 0 || skippedCount == testCount ? 'skipped' : 'passed')

    summary.setProperty('status', status)
    summary.setProperty('test.count', Integer.toString(testCount))
    summary.setProperty('test.executed.count', Integer.toString(executedCount))
    summary.setProperty('test.skipped.count', Integer.toString(skippedCount))
    summary.setProperty('test.failed.count', Integer.toString(failedCount))
    summary.setProperty('test.failure.count', Integer.toString(failureCount))
    summary.setProperty('test.error.count', Integer.toString(errorCount))
    summary.setProperty('executed', Boolean.toString(executedCount > 0))
    summary.setProperty('realDriverExecutionEvidence', Boolean.toString(status == 'passed' && executedCount > 0))
    writeCudaSmokeEvidenceSummary(summary, evidenceRows, status, executedCount)
    summary.setProperty('firstBlocker', blockers.isEmpty() ? 'none' : blockers.first())
    summary.setProperty('blocker.count', Integer.toString(blockers.size()))
    int blockerIndex = 0
    for (String blocker : blockers) {
        summary.setProperty('blocker.' + blockerIndex, blocker)
        blockerIndex++
    }
    return summary
}

private static void collectCudaSmokeBlockers(String text, LinkedHashSet<String> blockers) {
    if (text == null || text.isBlank()) {
        return
    }
    def matcher = text =~ /blockers=([^\s<]+)/
    while (matcher.find()) {
        matcher.group(1).split(',').each { String blocker ->
            String normalized = blocker.trim()
            if (!normalized.isBlank()) {
                blockers.add(normalized)
            }
        }
    }
}

private static void collectCudaSmokeEvidence(String text, List<Map<String, String>> evidenceRows) {
    if (text == null || text.isBlank()) {
        return
    }
    text.eachLine { String line ->
        String trimmed = line == null ? '' : line.trim()
        if (trimmed.startsWith('JTG_CUDA_SMOKE_EVIDENCE')) {
            Map<String, String> row = parseCudaSmokeEvidenceLine(trimmed)
            if (!row.isEmpty()) {
                evidenceRows.add(row)
            }
        }
    }
}

private static Map<String, String> parseCudaSmokeEvidenceLine(String line) {
    LinkedHashMap<String, String> row = new LinkedHashMap<>()
    String prefix = 'JTG_CUDA_SMOKE_EVIDENCE'
    if (line == null || !line.startsWith(prefix)) {
        return row
    }
    String payload = line.substring(prefix.length()).trim()
    if (payload.isBlank()) {
        return row
    }
    payload.split(/\s+/).each { String token ->
        int separator = token.indexOf('=')
        if (separator <= 0) {
            return
        }
        String key = token.substring(0, separator).trim()
        String value = token.substring(separator + 1).trim()
        if (!key.isBlank()) {
            row.put(key, decodeCudaSmokeEvidenceValue(value))
        }
    }
    return row
}

private static String decodeCudaSmokeEvidenceValue(String value) {
    if (value == null || value.isBlank()) {
        return 'unknown'
    }
    return value
            .replace('%20', ' ')
            .replace('%09', '\t')
            .replace('%0A', '\n')
            .replace('%0D', '\r')
            .replace('%25', '%')
}

private static void writeCudaSmokeEvidenceSummary(
        Properties summary,
        List<Map<String, String>> evidenceRows,
        String status,
        int executedCount
) {
    LinkedHashMap<String, Integer> formatCounts = new LinkedHashMap<>()
    LinkedHashMap<String, Integer> scenarioCounts = new LinkedHashMap<>()
    LinkedHashMap<String, Integer> scenarioRealDriverCounts = new LinkedHashMap<>()
    int realDriverCount = 0
    int moduleHandleCount = 0
    int functionHandleCount = 0
    int contextHandleCount = 0
    int launchSubmittedCount = 0
    int readbackCompleteCount = 0
    int sharedMemoryPresentCount = 0
    int payloadByteSizeMax = 0
    String firstGridShape = 'unknown'
    String firstBlockShape = 'unknown'

    for (Map<String, String> row : evidenceRows) {
        String format = sanitizeCudaSmokeEvidencePropertySegment(row.get('runtime.cuda.loadedModule.module.format'))
        formatCounts.put(format, formatCounts.getOrDefault(format, 0) + 1)
        String scenario = sanitizeCudaSmokeEvidencePropertySegment(row.get('runtime.cuda.smoke.scenario'))
        scenarioCounts.put(scenario, scenarioCounts.getOrDefault(scenario, 0) + 1)
        payloadByteSizeMax = Math.max(
                payloadByteSizeMax,
                parseCudaSmokeInt(row.get('runtime.cuda.loadedModule.module.payload.byteSize'))
        )
        boolean moduleHandlePresent = cudaSmokeEvidenceTrue(row, 'runtime.cuda.loadedModule.moduleHandle.present')
        boolean functionHandlePresent = cudaSmokeEvidenceTrue(row, 'runtime.cuda.loadedModule.functionHandle.present')
        boolean contextHandlePresent = cudaSmokeEvidenceTrue(row, 'runtime.cuda.loadedModule.contextHandle.present')
        boolean launchSubmitted = cudaSmokeEvidenceTrue(row, 'runtime.cuda.kernelLaunch.submitted')
        boolean readbackComplete = cudaSmokeReadbackComplete(row)

        moduleHandleCount += moduleHandlePresent ? 1 : 0
        functionHandleCount += functionHandlePresent ? 1 : 0
        contextHandleCount += contextHandlePresent ? 1 : 0
        launchSubmittedCount += launchSubmitted ? 1 : 0
        readbackCompleteCount += readbackComplete ? 1 : 0
        sharedMemoryPresentCount += cudaSmokeEvidenceTrue(row, 'runtime.cuda.kernelLaunch.sharedMemory.present') ? 1 : 0
        if (firstGridShape == 'unknown') {
            firstGridShape = cudaSmokeEvidenceKnown(row.get('runtime.cuda.kernelLaunch.launchShape.gridShape'))
        }
        if (firstBlockShape == 'unknown') {
            firstBlockShape = cudaSmokeEvidenceKnown(row.get('runtime.cuda.kernelLaunch.launchShape.blockShape'))
        }
        boolean realDriverEvidence = moduleHandlePresent && functionHandlePresent && contextHandlePresent && launchSubmitted && readbackComplete
        if (realDriverEvidence) {
            realDriverCount++
            scenarioRealDriverCounts.put(scenario, scenarioRealDriverCounts.getOrDefault(scenario, 0) + 1)
        }
    }

    summary.setProperty('evidence.count', Integer.toString(evidenceRows.size()))
    summary.setProperty('evidence.realDriver.count', Integer.toString(realDriverCount))
    summary.setProperty('evidence.module.payload.byteSize.max', Integer.toString(payloadByteSizeMax))
    summary.setProperty('evidence.moduleHandle.present.count', Integer.toString(moduleHandleCount))
    summary.setProperty('evidence.functionHandle.present.count', Integer.toString(functionHandleCount))
    summary.setProperty('evidence.contextHandle.present.count', Integer.toString(contextHandleCount))
    summary.setProperty('evidence.launch.submitted.count', Integer.toString(launchSubmittedCount))
    summary.setProperty('evidence.readback.complete.count', Integer.toString(readbackCompleteCount))
    summary.setProperty('evidence.sharedMemory.present.count', Integer.toString(sharedMemoryPresentCount))
    summary.setProperty('evidence.firstLaunch.gridShape', firstGridShape)
    summary.setProperty('evidence.firstLaunch.blockShape', firstBlockShape)
    summary.setProperty(
            'realDriverExecutionEvidence.rich',
            Boolean.toString(status == 'passed' && executedCount > 0 && realDriverCount >= executedCount)
    )
    formatCounts.each { String format, Integer count ->
        summary.setProperty('evidence.module.format.' + format + '.count', Integer.toString(count))
    }
    scenarioCounts.each { String scenario, Integer count ->
        summary.setProperty('evidence.scenario.' + scenario + '.count', Integer.toString(count))
        summary.setProperty(
                'evidence.scenario.' + scenario + '.realDriver.count',
                Integer.toString(scenarioRealDriverCounts.getOrDefault(scenario, 0))
        )
    }
}

private static boolean cudaSmokeEvidenceTrue(Map<String, String> row, String key) {
    return 'true'.equalsIgnoreCase(row.getOrDefault(key, 'false'))
}

private static boolean cudaSmokeReadbackComplete(Map<String, String> row) {
    if (cudaSmokeEvidenceTrue(row, 'runtime.cuda.readback.complete')) {
        return true
    }
    if (cudaSmokeEvidenceTrue(row, 'runtime.backend.invoke.readback.complete')) {
        return true
    }
    int required = parseCudaSmokeInt(row.get('runtime.cuda.kernelLaunch.readback.required.count'))
    int completed = parseCudaSmokeInt(row.get('runtime.cuda.kernelLaunch.readback.completed.count'))
    return completed >= required
}

private static String cudaSmokeEvidenceKnown(String value) {
    if (value == null || value.isBlank() || value == 'unknown') {
        return 'unknown'
    }
    return value.trim()
}

private static String sanitizeCudaSmokeEvidencePropertySegment(String value) {
    if (value == null || value.isBlank()) {
        return 'unknown'
    }
    String normalized = value.trim().toLowerCase(java.util.Locale.ROOT).replaceAll(/[^a-z0-9_.-]/, '_')
    return normalized.isBlank() ? 'unknown' : normalized
}

private static int parseCudaSmokeInt(String value) {
    try {
        return Integer.parseInt(value == null || value.isBlank() ? '0' : value.trim())
    } catch (NumberFormatException ignored) {
        return 0
    }
}

private static Properties openClI3ReadinessBaseline(Properties current) {
    Properties baseline = new Properties()
    baseline.setProperty('format', 'javatogpu.opencl.i3-readiness-baseline.v1')
    copyOpenClI3BaselineField(current, baseline, 'status')
    copyOpenClI3BaselineField(current, baseline, 'kernel.count')
    copyOpenClI3BaselineField(current, baseline, 'reviewReady.count')
    copyOpenClI3BaselineField(current, baseline, 'blocked.count')
    copyOpenClI3BaselineField(current, baseline, 'productionEnabled.count')
    copyOpenClI3BaselineField(current, baseline, 'productionMutationEnabled')
    int kernelCount = parseOpenClI3Int(current.getProperty('kernel.count'))
    for (int index = 0; index < kernelCount; index++) {
        String prefix = 'kernel.' + index + '.'
        copyOpenClI3BaselineField(current, baseline, prefix + 'resource')
        copyOpenClI3BaselineField(current, baseline, prefix + 'i3Status')
        copyOpenClI3BaselineField(current, baseline, prefix + 'runtimeIr')
        copyOpenClI3BaselineField(current, baseline, prefix + 'sourcePromotionStatus')
        copyOpenClI3BaselineField(current, baseline, prefix + 'optimizerProductionGateStatus')
        copyOpenClI3BaselineField(current, baseline, prefix + 'productionMutationEnabled')
    }
    return baseline
}

private static void copyOpenClI3BaselineField(Properties source, Properties target, String key) {
    target.setProperty(key, source.getProperty(key, 'unknown'))
}

private static void validateOpenClI3ReadinessBaseline(Properties baseline, Properties current, File baselineFile) {
    if (baseline.getProperty('format') != 'javatogpu.opencl.i3-readiness-baseline.v1') {
        throw new GradleException('OpenCL I3 readiness baseline has an unsupported format in ' + baselineFile)
    }
    if (current.getProperty('productionMutationEnabled', 'false') == 'true') {
        throw new GradleException('OpenCL I3 readiness unexpectedly enabled production mutation; update gates intentionally before changing the baseline')
    }

    int baselineKernelCount = parseOpenClI3Int(baseline.getProperty('kernel.count'))
    int currentKernelCount = parseOpenClI3Int(current.getProperty('kernel.count'))
    if (baselineKernelCount != currentKernelCount) {
        throw new GradleException('OpenCL I3 readiness kernel count changed from ' + baselineKernelCount
                + ' to ' + currentKernelCount + '; refresh the baseline after reviewing workload coverage')
    }

    int baselineReviewReady = parseOpenClI3Int(baseline.getProperty('reviewReady.count'))
    int currentReviewReady = parseOpenClI3Int(current.getProperty('reviewReady.count'))
    if (currentReviewReady < baselineReviewReady) {
        throw new GradleException('OpenCL I3 readiness regressed: review-ready kernels dropped from '
                + baselineReviewReady + ' to ' + currentReviewReady)
    }

    int baselineBlocked = parseOpenClI3Int(baseline.getProperty('blocked.count'))
    int currentBlocked = parseOpenClI3Int(current.getProperty('blocked.count'))
    if (currentBlocked > baselineBlocked) {
        throw new GradleException('OpenCL I3 readiness regressed: blocked kernels increased from '
                + baselineBlocked + ' to ' + currentBlocked)
    }

    int baselineProductionEnabled = parseOpenClI3Int(baseline.getProperty('productionEnabled.count'))
    int currentProductionEnabled = parseOpenClI3Int(current.getProperty('productionEnabled.count'))
    if (currentProductionEnabled > baselineProductionEnabled) {
        throw new GradleException('OpenCL I3 production-enabled kernel count increased from '
                + baselineProductionEnabled + ' to ' + currentProductionEnabled
                + '; production promotion must be reviewed explicitly')
    }

    for (int index = 0; index < baselineKernelCount; index++) {
        String prefix = 'kernel.' + index + '.'
        String baselineResource = baseline.getProperty(prefix + 'resource', 'unknown')
        String currentResource = current.getProperty(prefix + 'resource', 'unknown')
        if (baselineResource != currentResource) {
            throw new GradleException('OpenCL I3 readiness kernel resource drifted at index ' + index
                    + ': baseline=' + baselineResource + ', current=' + currentResource)
        }
        String baselineStatus = baseline.getProperty(prefix + 'i3Status', 'unknown')
        String currentStatus = current.getProperty(prefix + 'i3Status', 'unknown')
        if (openClI3StatusScore(currentStatus) < openClI3StatusScore(baselineStatus)) {
            throw new GradleException('OpenCL I3 readiness regressed for ' + baselineResource
                    + ': ' + baselineStatus + ' -> ' + currentStatus)
        }
        String baselineRuntimeIr = baseline.getProperty(prefix + 'runtimeIr', 'unknown')
        String currentRuntimeIr = current.getProperty(prefix + 'runtimeIr', 'unknown')
        if (openClI3RuntimeIrScore(currentRuntimeIr) < openClI3RuntimeIrScore(baselineRuntimeIr)) {
            throw new GradleException('OpenCL I3 runtime IR stage regressed for ' + baselineResource
                    + ': ' + baselineRuntimeIr + ' -> ' + currentRuntimeIr)
        }
    }
}

private static void expectOpenClI3ReadinessBaselineFailure(Properties baseline, Properties current, String scenario) {
    try {
        validateOpenClI3ReadinessBaseline(baseline, current, new File('synthetic-i3-baseline.properties'))
    } catch (GradleException expected) {
        return
    }
    throw new GradleException('Synthetic OpenCL I3 readiness baseline scenario unexpectedly passed: ' + scenario)
}

private static int parseOpenClI3Int(String value) {
    try {
        return Integer.parseInt(value == null ? '0' : value.trim())
    } catch (NumberFormatException ignored) {
        return 0
    }
}

private static int openClI3StatusScore(String status) {
    return switch (status) {
        case 'production-enabled' -> 3
        case 'review-ready' -> 2
        case 'blocked' -> 1
        default -> 1
    }
}

private static int openClI3RuntimeIrScore(String stage) {
    return switch (stage) {
        case 'optimized' -> 2
        case 'original' -> 1
        default -> 0
    }
}

private static Properties openClBackendSourcePromotionWorkloadBaseline(Properties current) {
    Properties baseline = new Properties()
    baseline.setProperty('format', 'javatogpu.opencl.backend-source-promotion-workload-baseline.v1')
    copyOpenClSourcePromotionBaselineField(current, baseline, 'status')
    copyOpenClSourcePromotionBaselineField(current, baseline, 'kernel.count')
    copyOpenClSourcePromotionBaselineField(current, baseline, 'reviewReady')
    copyOpenClSourcePromotionBaselineField(current, baseline, 'sourceParityMatched')
    copyOpenClSourcePromotionBaselineField(current, baseline, 'runtimeEquivalencePassed')
    copyOpenClSourcePromotionBaselineField(current, baseline, 'productionSourceSwitching')
    copyOpenClIndexedSourcePromotionBaselineFields(current, baseline, 'sourceSwitching.sourcePromotionFirstBlockerFamily')

    int kernelCount = parseOpenClI3Int(current.getProperty('kernel.count'))
    for (int index = 0; index < kernelCount; index++) {
        String prefix = 'kernel.' + index + '.'
        copyOpenClSourcePromotionBaselineField(current, baseline, prefix + 'sourceKernelResource')
        copyOpenClSourcePromotionBaselineField(current, baseline, prefix + 'status')
        copyOpenClSourcePromotionBaselineField(current, baseline, prefix + 'reviewReady')
        copyOpenClSourcePromotionBaselineField(current, baseline, prefix + 'sourceParityMatched')
        copyOpenClSourcePromotionBaselineField(current, baseline, prefix + 'runtimeEquivalencePassed')
        copyOpenClSourcePromotionBaselineField(current, baseline, prefix + 'sourceSwitching.sourcePromotionFirstBlocker')
    }
    return baseline
}

private static void copyOpenClSourcePromotionBaselineField(Properties source, Properties target, String key) {
    target.setProperty(key, source.getProperty(key, 'unknown'))
}

private static void copyOpenClIndexedSourcePromotionBaselineFields(Properties source, Properties target, String keyPrefix) {
    int count = parseOpenClI3Int(source.getProperty(keyPrefix + '.count'))
    target.setProperty(keyPrefix + '.count', Integer.toString(count))
    for (int index = 0; index < count; index++) {
        copyOpenClSourcePromotionBaselineField(source, target, keyPrefix + '.' + index + '.name')
        copyOpenClSourcePromotionBaselineField(source, target, keyPrefix + '.' + index + '.count')
    }
}

private static void validateOpenClBackendSourcePromotionWorkloadBaseline(
        Properties baseline,
        Properties current,
        File baselineFile
) {
    if (baseline.getProperty('format') != 'javatogpu.opencl.backend-source-promotion-workload-baseline.v1') {
        throw new GradleException('OpenCL backend source-promotion workload baseline has an unsupported format in ' + baselineFile)
    }
    if (current.getProperty('productionSourceSwitching', 'false') == 'enabled') {
        throw new GradleException('OpenCL backend source-promotion workload unexpectedly enabled production source switching; review gates explicitly before changing the baseline')
    }

    int baselineKernelCount = parseOpenClI3Int(baseline.getProperty('kernel.count'))
    int currentKernelCount = parseOpenClI3Int(current.getProperty('kernel.count'))
    if (baselineKernelCount != currentKernelCount) {
        throw new GradleException('OpenCL backend source-promotion workload kernel count changed from ' + baselineKernelCount
                + ' to ' + currentKernelCount + '; refresh the baseline after reviewing workload coverage')
    }

    String baselineStatus = baseline.getProperty('status', 'blocked')
    String currentStatus = current.getProperty('status', 'blocked')
    if (openClI3StatusScore(currentStatus) < openClI3StatusScore(baselineStatus)) {
        throw new GradleException('OpenCL backend source-promotion workload status regressed: '
                + baselineStatus + ' -> ' + currentStatus)
    }

    validateOpenClSourcePromotionBooleanProgress(baseline, current, 'reviewReady')
    validateOpenClSourcePromotionBooleanProgress(baseline, current, 'sourceParityMatched')
    validateOpenClSourcePromotionBooleanProgress(baseline, current, 'runtimeEquivalencePassed')
    validateOpenClSourcePromotionFirstBlockerFamilies(baseline, current)

    for (int index = 0; index < baselineKernelCount; index++) {
        String prefix = 'kernel.' + index + '.'
        String baselineResource = baseline.getProperty(prefix + 'sourceKernelResource', 'unknown')
        String currentResource = current.getProperty(prefix + 'sourceKernelResource', 'unknown')
        if (baselineResource != currentResource) {
            throw new GradleException('OpenCL backend source-promotion workload kernel resource drifted at index ' + index
                    + ': baseline=' + baselineResource + ', current=' + currentResource)
        }

        String baselineKernelStatus = baseline.getProperty(prefix + 'status', 'blocked')
        String currentKernelStatus = current.getProperty(prefix + 'status', 'blocked')
        if (openClI3StatusScore(currentKernelStatus) < openClI3StatusScore(baselineKernelStatus)) {
            throw new GradleException('OpenCL backend source-promotion workload regressed for ' + baselineResource
                    + ': ' + baselineKernelStatus + ' -> ' + currentKernelStatus)
        }

        validateOpenClSourcePromotionBooleanProgress(baseline, current, prefix + 'reviewReady')
        validateOpenClSourcePromotionBooleanProgress(baseline, current, prefix + 'sourceParityMatched')
        validateOpenClSourcePromotionBooleanProgress(baseline, current, prefix + 'runtimeEquivalencePassed')
    }
}

private static void validateOpenClSourcePromotionBooleanProgress(Properties baseline, Properties current, String key) {
    boolean baselineReady = Boolean.parseBoolean(baseline.getProperty(key, 'false'))
    boolean currentReady = Boolean.parseBoolean(current.getProperty(key, 'false'))
    if (baselineReady && !currentReady) {
        throw new GradleException('OpenCL backend source-promotion workload boolean regressed for ' + key
                + ': true -> false')
    }
}

private static void validateOpenClSourcePromotionFirstBlockerFamilies(Properties baseline, Properties current) {
    Map<String, Integer> baselineFamilies = openClIndexedCountMap(baseline, 'sourceSwitching.sourcePromotionFirstBlockerFamily')
    Map<String, Integer> currentFamilies = openClIndexedCountMap(current, 'sourceSwitching.sourcePromotionFirstBlockerFamily')
    for (Map.Entry<String, Integer> family : baselineFamilies.entrySet()) {
        int currentCount = currentFamilies.getOrDefault(family.getKey(), 0)
        if (currentCount > family.getValue()) {
            throw new GradleException('OpenCL backend source-promotion workload blocker family increased for '
                    + family.getKey() + ': ' + family.getValue() + ' -> ' + currentCount)
        }
    }
    for (Map.Entry<String, Integer> family : currentFamilies.entrySet()) {
        if (!baselineFamilies.containsKey(family.getKey()) && family.getValue() > 0) {
            throw new GradleException('OpenCL backend source-promotion workload introduced blocker family '
                    + family.getKey() + ' count=' + family.getValue())
        }
    }
}

private static Map<String, Integer> openClIndexedCountMap(Properties properties, String keyPrefix) {
    Map<String, Integer> counts = new LinkedHashMap<>()
    int count = parseOpenClI3Int(properties.getProperty(keyPrefix + '.count'))
    for (int index = 0; index < count; index++) {
        String name = properties.getProperty(keyPrefix + '.' + index + '.name', 'unknown')
        int value = parseOpenClI3Int(properties.getProperty(keyPrefix + '.' + index + '.count'))
        counts.put(name, value)
    }
    return counts
}

private static void expectOpenClBackendSourcePromotionWorkloadBaselineFailure(
        Properties baseline,
        Properties current,
        String scenario
) {
    try {
        validateOpenClBackendSourcePromotionWorkloadBaseline(
                baseline,
                current,
                new File('synthetic-source-promotion-workload-baseline.properties')
        )
    } catch (GradleException expected) {
        return
    }
    throw new GradleException('Synthetic OpenCL backend source-promotion workload baseline scenario unexpectedly passed: ' + scenario)
}
