    mainClass = 'net.sixik.ga_utils.javatogpu.runtime.opencl.OpenClValidationReporter'
    systemProperty 'javatogpu.opencl.validationReportFile', layout.buildDirectory.file('reports/opencl/validation-report.md').get().asFile.absolutePath
    systemProperty 'javatogpu.opencl.longRunningSummaryFile', layout.buildDirectory.file('reports/opencl/long-running-summary.properties').get().asFile.absolutePath
    systemProperty 'javatogpu.opencl.workloadSummaryFile', layout.buildDirectory.file('reports/opencl/workload-summary.properties').get().asFile.absolutePath
