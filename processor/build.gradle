def recordBucketStatus = { String taskName, String status ->
    Properties properties = new Properties()
    if (openClBucketStatusFile.exists()) {
        openClBucketStatusFile.withInputStream { properties.load(it) }
    } else {
        openClBucketStatusFile.parentFile.mkdirs()
    }
    String prefix = taskName.replaceAll('[^a-zA-Z0-9]+', '_')
    properties.setProperty(prefix + '.taskName', taskName)
    properties.setProperty(prefix + '.status', status)
    properties.setProperty(prefix + '.recordedAtUtc', Instant.now().toString())
    openClBucketStatusFile.withOutputStream { properties.store(it, 'JavaToGpu OpenCL validation bucket status registry') }
}

def attachBucketStatusRecording = { Test task ->
    task.finalizedBy 'openClValidationReport'
    task.afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            String status = switch (result.resultType.toString()) {
                case 'SUCCESS' -> 'passed'
                case 'FAILURE' -> 'failed'
                case 'SKIPPED' -> 'skipped'
                default -> result.resultType.toString().toLowerCase(java.util.Locale.ROOT)
            }
            recordBucketStatus(task.name, status)
        }
    }
}

