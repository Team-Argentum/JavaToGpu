tasks.register('stageOpenClValidationHistoryCache') {
    group = 'verification'
    description = 'Stages the current OpenCL validation history for the next CI run baseline.'
    dependsOn 'openClValidationReport'
    inputs.file(openClValidationHistoryFile)
    inputs.file(openClValidationHistoryMarkdownFile)
    outputs.file(new File(openClValidationHistoryCacheDirectory, 'validation-history.properties'))
    outputs.file(new File(openClValidationHistoryCacheDirectory, 'validation-history.md'))

    doLast {
        if (!openClValidationHistoryFile.isFile()) {
            throw new GradleException('Missing OpenCL validation history properties: ' + openClValidationHistoryFile)
        }
        if (!openClValidationHistoryMarkdownFile.isFile()) {
            throw new GradleException('Missing OpenCL validation history Markdown: ' + openClValidationHistoryMarkdownFile)
        }
        openClValidationHistoryCacheDirectory.mkdirs()
        java.nio.file.Files.copy(
                openClValidationHistoryFile.toPath(),
                new File(openClValidationHistoryCacheDirectory, 'validation-history.properties').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        java.nio.file.Files.copy(
                openClValidationHistoryMarkdownFile.toPath(),
                new File(openClValidationHistoryCacheDirectory, 'validation-history.md').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        logger.lifecycle('Staged OpenCL validation history cache at {}', openClValidationHistoryCacheDirectory)
    }
}

tasks.register('writeOpenClI3ReadinessWorkloadBaseline') {
    group = 'verification'
    description = 'Persists the current OpenCL I3 workload readiness summary as a comparison baseline.'
    dependsOn 'openClValidationReport'
    inputs.file(openClI3ReadinessWorkloadSummaryFile)
    outputs.file(openClI3ReadinessBaselineFile)

    doLast {
        if (!openClI3ReadinessWorkloadSummaryFile.isFile()) {
            throw new GradleException('Missing OpenCL I3 readiness workload summary: ' + openClI3ReadinessWorkloadSummaryFile)
        }
        File baselineFile = openClI3ReadinessBaselineFile.get()
        baselineFile.parentFile.mkdirs()
        Properties current = loadPropertiesFile(openClI3ReadinessWorkloadSummaryFile)
        Properties baseline = openClI3ReadinessBaseline(current)
        baselineFile.withOutputStream { stream ->
