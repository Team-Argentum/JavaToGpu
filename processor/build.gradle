def registerCudaSmokeLane = { String taskName, String outputFormat, File summaryFile ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Runs the opt-in real-driver CUDA staged execution smoke suite with nvcc ${outputFormat} output."
        useJUnitPlatform()
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        systemProperty 'javatogpu.cuda.smoke.enabled', 'true'
        systemProperty 'javatogpu.cuda.nvcc.outputFormat', outputFormat
        String nvccPath = System.getenv('JTG_CUDA_NVCC') ?: ''
        if (!nvccPath.isBlank()) {
            systemProperty 'javatogpu.cuda.nvcc.path', nvccPath
        }
        String smokeArch = System.getenv('JTG_CUDA_SMOKE_ARCH') ?: ''
        if (!smokeArch.isBlank()) {
            systemProperty 'javatogpu.cuda.smoke.arch', smokeArch
        }
        String smokeRequired = System.getenv('JTG_CUDA_SMOKE_REQUIRED') ?: ''
        if (!smokeRequired.isBlank()) {
            systemProperty 'javatogpu.cuda.smoke.required', smokeRequired
        }
        filter {
            includeTestsMatching 'net.sixik.ga_utils.javatogpu.runtime.cuda.CudaDriverExecutionIntegrationTest'
        }
        attachBucketStatusRecording(it)
    }
    String summaryTaskName = taskName + 'SummaryReport'
    tasks.register(summaryTaskName) {
        group = 'verification'
        description = "Writes a machine-readable summary for ${taskName}."
        inputs.dir(layout.buildDirectory.dir("test-results/${taskName}"))
        outputs.file(summaryFile)
        mustRunAfter taskName

        doLast {
            File resultsDirectory = layout.buildDirectory.dir("test-results/${taskName}").get().asFile
            Properties summary = cudaSmokeSummary(
                    resultsDirectory,
                    Boolean.toString(Boolean.parseBoolean(System.getenv('JTG_CUDA_SMOKE_REQUIRED') ?: 'false')),
                    System.getenv('JTG_CUDA_NVCC') ?: 'nvcc',
                    System.getenv('JTG_CUDA_SMOKE_ARCH') ?: 'auto',
                    outputFormat,
                    taskName
            )
            summaryFile.parentFile.mkdirs()
            summaryFile.withOutputStream { stream ->
                summary.store(stream, "JavaToGpu staged CUDA ${outputFormat} smoke summary")
            }
            logger.lifecycle('CUDA {} smoke summary written: status={}, executed={}, firstBlocker={} -> {}',
                    outputFormat,
                    summary.getProperty('status'),
                    summary.getProperty('test.executed.count'),
                    summary.getProperty('firstBlocker'),
                    summaryFile)
        }
    }
    String summaryGateTaskName = taskName + 'SummaryGate'
    tasks.register(summaryGateTaskName) {
        group = 'verification'
        description = "Validates real-driver evidence in the ${taskName} summary."
        inputs.file(summaryFile)
        dependsOn summaryTaskName

        doLast {
            validateCudaSmokeSummaryGate(summaryFile, taskName, outputFormat)
            logger.lifecycle('CUDA {} smoke summary gate passed: richEvidence={} -> {}',
                    outputFormat,
                    loadPropertiesFile(summaryFile).getProperty('realDriverExecutionEvidence.rich', 'false'),
                    summaryFile)
        }
    }
    tasks.named(taskName) {
        finalizedBy summaryTaskName
    }
    tasks.named(summaryTaskName) {
        finalizedBy summaryGateTaskName
    }
}

