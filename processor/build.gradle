        Properties summary = cudaSmokeSummary(
                resultsDirectory,
                Boolean.toString(Boolean.parseBoolean(System.getenv('JTG_CUDA_SMOKE_REQUIRED') ?: 'false')),
                System.getenv('JTG_CUDA_NVCC') ?: 'nvcc',
                System.getenv('JTG_CUDA_SMOKE_ARCH') ?: 'auto',
                System.getenv('JTG_CUDA_NVCC_OUTPUT_FORMAT') ?: 'ptx',
                'integrationCudaSmokeTest'
        )
        cudaSmokeSummaryFile.parentFile.mkdirs()
        cudaSmokeSummaryFile.withOutputStream { stream ->
            summary.store(stream, 'JavaToGpu staged CUDA smoke summary')
        }
        logger.lifecycle('CUDA smoke summary written: status={}, executed={}, firstBlocker={} -> {}',
                summary.getProperty('status'),
                summary.getProperty('test.executed.count'),
                summary.getProperty('firstBlocker'),
                cudaSmokeSummaryFile)
    }
}

