plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

import java.time.Instant
import groovy.xml.XmlSlurper
import org.gradle.api.tasks.testing.Test

description = 'Experimental Java-to-OpenCL compiler and runtime for GPU-safe Java kernels.'
group = rootProject.group
version = rootProject.version

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

sourceSets {
    benchmark {
        java.srcDir 'src/benchmark/java'
        resources.srcDir 'src/benchmark/resources'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    benchmarkImplementation.extendsFrom testImplementation
    benchmarkRuntimeOnly.extendsFrom testRuntimeOnly
}

def secretValue = { String gradlePropertyName, String environmentVariableName ->
    providers.gradleProperty(gradlePropertyName)
            .orElse(providers.environmentVariable(environmentVariableName))
}

def centralUsernameProvider = secretValue('mavenCentralUsername', 'MAVEN_CENTRAL_USERNAME')
def centralPasswordProvider = secretValue('mavenCentralPassword', 'MAVEN_CENTRAL_PASSWORD')
def signingKeyProvider = secretValue('signingInMemoryKey', 'SIGNING_IN_MEMORY_KEY')
def signingPasswordProvider = secretValue('signingInMemoryKeyPassword', 'SIGNING_IN_MEMORY_KEY_PASSWORD')
def publicationArtifactId = findProperty('javatogpu.artifactId') ?: 'javatogpu'

def osName = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
def lwjglNatives = osName.contains("win")
        ? "natives-windows"
        : (osName.contains("mac") ? "natives-macos" : "natives-linux")
def openClBucketStatusFile = layout.buildDirectory.file('reports/opencl/bucket-status.properties').get().asFile

def recordBucketStatus = { String taskName, String status ->
    Properties properties = new Properties()
    if (openClBucketStatusFile.exists()) {
        openClBucketStatusFile.withInputStream { properties.load(it) }
    } else {
        openClBucketStatusFile.parentFile.mkdirs()
    }
    String prefix = taskName.replaceAll('[^a-zA-Z0-9]+', '_')
    properties.setProperty(prefix + '.taskName', taskName)
    properties.setProperty(prefix + '.status', status)
    properties.setProperty(prefix + '.recordedAtUtc', Instant.now().toString())
    openClBucketStatusFile.withOutputStream { properties.store(it, 'JavaToGpu OpenCL validation bucket status registry') }
}

def attachBucketStatusRecording = { Test task ->
    task.finalizedBy 'openClValidationReport'
    task.afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            String status = switch (result.resultType.toString()) {
                case 'SUCCESS' -> 'passed'
                case 'FAILURE' -> 'failed'
                case 'SKIPPED' -> 'skipped'
                default -> result.resultType.toString().toLowerCase(java.util.Locale.ROOT)
            }
            recordBucketStatus(task.name, status)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.github.javaparser:javaparser-core:3.28.1'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-opencl'
    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"

    implementation 'io.github.deussixik:packager:1.0.0-alpha.1'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = publicationArtifactId

            pom {
                name = 'JavaToGpu'
                description = project.description
                url = 'https://github.com/Team-Argentum/JavaToGpu'

                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.en.html'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'Team-Argentum'
                        name = 'Team Argentum'
                        organization = 'Team Argentum'
                        organizationUrl = 'https://github.com/Team-Argentum'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/Team-Argentum/JavaToGpu.git'
                    developerConnection = 'scm:git:https://github.com/Team-Argentum/JavaToGpu.git'
                    url = 'https://github.com/Team-Argentum/JavaToGpu'
                }

                withXml {
                    // The library needs LWJGL natives at runtime, but Maven POMs cannot model
                    // platform-specific native classifiers safely. Consumers should choose their
                    // own native classifier; tests keep using the local OS classifier below.
                    def dependenciesNode = asNode().dependencies
                    if (dependenciesNode) {
                        dependenciesNode[0].dependency.findAll { dependency ->
                            dependency.groupId.text() == 'org.lwjgl'
                                    && dependency.artifactId.text() == 'lwjgl'
                                    && dependency.classifier
                                    && dependency.classifier.text().startsWith('natives-')
                        }.each { dependency ->
                            dependency.parent().remove(dependency)
                        }
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'localStaging'
            url = layout.buildDirectory.dir('maven-staging')
        }
        maven {
            name = 'centralSnapshots'
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            credentials {
                username = centralUsernameProvider.getOrElse('')
                password = centralPasswordProvider.getOrElse('')
            }
        }
        maven {
            name = 'centralReleases'
            url = uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
            credentials {
                username = centralUsernameProvider.getOrElse('')
                password = centralPasswordProvider.getOrElse('')
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Avoid publishing Gradle metadata with a build-host-specific LWJGL native classifier.
    enabled = false
}

tasks.register('validateMavenCentralReleaseReadiness') {
    group = 'publishing'
    description = 'Fails release publishing if the generated Maven POM contains dependencies Maven Central should not release.'
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')
    doLast {
        if (version.toString().endsWith('-SNAPSHOT')) {
            return
        }
        File pomFile = layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile
        if (!pomFile.isFile()) {
            throw new GradleException('Maven Central release is not ready: generated POM is missing at ' + pomFile)
        }

        def pom = new XmlSlurper(false, false).parse(pomFile)
        java.util.List<String> unsafeDependencies = []
        pom.dependencies.dependency.each { dependency ->
            String groupId = dependency.groupId.text()
            String artifactId = dependency.artifactId.text()
            String versionText = dependency.version.text()
            String coordinates = groupId + ':' + artifactId + ':' + (versionText.isBlank() ? '<managed>' : versionText)
            String normalizedVersion = versionText.toLowerCase(Locale.ROOT)

            if (normalizedVersion.contains('snapshot')) {
                unsafeDependencies.add(coordinates + ' (snapshot dependency)')
            } else if (groupId.startsWith('com.github.') && normalizedVersion.contains('master')) {
                unsafeDependencies.add(coordinates + ' (JitPack branch dependency)')
            }
        }

        if (!unsafeDependencies.isEmpty()) {
            throw new GradleException('Maven Central release is not ready: generated POM contains non-release-safe dependencies: '
                    + unsafeDependencies.join(', ')
                    + '. Replace them with Maven Central releases, publish an internal fork with stable coordinates, or split/shade the OpenCL runtime dependency before running a release publish.')
        }
    }
}

tasks.matching { task ->
    task.name == 'publishMavenJavaPublicationToCentralReleasesRepository'
            || task.name == 'publishAllPublicationsToCentralReleasesRepository'
}.configureEach {
    dependsOn tasks.named('validateMavenCentralReleaseReadiness')
}

signing {
    def signingKey = signingKeyProvider.orNull
    def signingPassword = signingPasswordProvider.orNull
    required {
        !version.toString().endsWith('-SNAPSHOT') && gradle.taskGraph.allTasks.any { task ->
            task.name.toLowerCase(Locale.ROOT).contains('central')
                    || task.name == 'publish'
        }
    }
    if (signingKey != null && !signingKey.isBlank()) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}

