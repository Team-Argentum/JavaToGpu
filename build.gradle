plugins {
    id 'java'
}

group = 'io.github.deussixik'
version = findProperty('javatogpu.version') ?: '0.1.0-alpha.1'

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

test {
    useJUnitPlatform()
}

def irValidationExamplesEnabled = providers.gradleProperty('javatogpu.enableIrValidationExamples')
        .map { it.toBoolean() }
        .getOrElse(false)

def irValidationExampleReports = [
        [
                name      : 'examples-app',
                compile   : ':examples-app:compileJava',
                reportFile: layout.projectDirectory.file('examples-app/build/generated/sources/annotationProcessor/java/main/reports/examples-app-ir-validation.properties')
        ],
        [
                name      : 'test-app',
                compile   : ':test-app:compileJava',
                reportFile: layout.projectDirectory.file('test-app/build/generated/sources/annotationProcessor/java/main/reports/test-app-ir-validation.properties')
        ]
]

tasks.register('validateIrValidationExampleReports') {
    group = 'verification'
    description = 'Verifies opt-in IR validation dogfooding reports for safety and read-only optimizer-readiness stability.'
    dependsOn irValidationExampleReports.collect { it.compile }
    inputs.files(irValidationExampleReports.collect { it.reportFile })

    doLast {
        if (!irValidationExamplesEnabled) {
            throw new GradleException(
                    'IR validation example report contract requires --project-prop javatogpu.enableIrValidationExamples=true'
            )
        }

        irValidationExampleReports.each { reportSpec ->
            File reportFile = reportSpec.reportFile.asFile
            if (!reportFile.isFile()) {
                throw new GradleException('Missing IR validation dogfooding report for ' + reportSpec.name + ': ' + reportFile)
            }

            Properties report = new Properties()
            reportFile.withInputStream { stream -> report.load(stream) }

            if (report.getProperty('format') != 'javatogpu.ir.validation.v1') {
                throw new GradleException('Unexpected IR validation report format for ' + reportSpec.name + ': '
                        + report.getProperty('format'))
            }

            int entryCount = parseReportInt(report, 'entry.count', reportSpec.name)
            int safetyOk = 0
            int optimizerBlocked = 0
            int optimizerReadOnlyBlocked = 0
            int csePolicyBlocked = 0
            int cseLiteralPromotionBlocked = 0
            int autoVectorizationBlocked = 0
            java.util.List<String> failures = []
            for (int index = 0; index < entryCount; index++) {
                String safety = report.getProperty('entry.' + index + '.safety')
                if (safety == 'ok') {
                    safetyOk++
                } else if (safety == 'failed') {
                    String methodName = report.getProperty('entry.' + index + '.methodName', '<unknown>')
                    String safetyError = report.getProperty('entry.' + index + '.safetyError', '<missing safetyError>')
                    failures.add(methodName + ': ' + safetyError)
                } else {
                    throw new GradleException('Unexpected IR validation safety state for ' + reportSpec.name
                            + ' entry ' + index + ': ' + safety)
                }

                OptimizerReadinessContractResult optimizerResult = validateOptimizerReadinessContract(
                        report,
                        reportSpec.name,
                        index
                )
                if (optimizerResult.blocked) {
                    optimizerBlocked++
                }
                if (optimizerResult.readOnlyBlocked) {
                    optimizerReadOnlyBlocked++
                }
                if (optimizerResult.csePolicyBlocked) {
                    csePolicyBlocked++
                }
                if (optimizerResult.cseLiteralPromotionBlocked) {
                    cseLiteralPromotionBlocked++
                }
                if (optimizerResult.autoVectorizationBlocked) {
                    autoVectorizationBlocked++
                }
            }

            if (!failures.isEmpty()) {
                throw new GradleException('IR validation dogfooding safety contract failed for ' + reportSpec.name
                        + ' (' + failures.size() + '/' + entryCount + ' failed): ' + failures.join('; '))
            }

            logger.lifecycle('IR validation dogfooding safety contract OK for {}: safety.ok={} safety.failed=0 entry.count={}',
                    reportSpec.name,
                    safetyOk,
                    entryCount)
            logger.lifecycle('IR validation dogfooding optimizer-readiness contract OK for {}: blocked={} readOnlyBlocked={} csePolicyBlocked={} cseLiteralPromotionBlocked={} autoVectorizationBlocked={} entry.count={}',
                    reportSpec.name,
                    optimizerBlocked,
                    optimizerReadOnlyBlocked,
                    csePolicyBlocked,
                    cseLiteralPromotionBlocked,
                    autoVectorizationBlocked,
                    entryCount)
        }
    }
}

tasks.named('check') {
    if (irValidationExamplesEnabled) {
        dependsOn tasks.named('validateIrValidationExampleReports')
    }
}

private static int parseReportInt(Properties report, String key, String reportName) {
    String value = report.getProperty(key)
    if (value == null || value.isBlank()) {
        throw new GradleException('Missing IR validation report key for ' + reportName + ': ' + key)
    }
    try {
        return Integer.parseInt(value)
    } catch (NumberFormatException exception) {
        throw new GradleException('Invalid integer IR validation report key for ' + reportName + ': ' + key + '=' + value, exception)
    }
}

private static OptimizerReadinessContractResult validateOptimizerReadinessContract(
        Properties report,
        String reportName,
        int index
) {
    String prefix = 'entry.' + index + '.'
    String methodName = report.getProperty(prefix + 'methodName', '<unknown>')
    String optimizerVerdict = requireReportValue(report, prefix + 'optimizerLayerReadinessVerdict', reportName)
    String firstBlockingLayer = requireReportValue(report, prefix + 'optimizerLayerReadinessFirstBlockingLayer', reportName)
    String blockingLayers = requireReportValue(report, prefix + 'optimizerLayerReadinessBlockingLayers', reportName)
    String optimizerGateBlocked = requireReportValue(report, prefix + 'optimizerGateBlocked', reportName)
    String optimizerGateSource = requireReportValue(report, prefix + 'optimizerGateSource', reportName)
    String optimizerGateFamily = requireReportValue(report, prefix + 'optimizerGateFamily', reportName)
    String cseLayerVerdict = requireReportValue(report, prefix + 'cseLayerReadinessVerdict', reportName)
    String cseRewritePolicyReadiness = requireReportValue(report, prefix + 'cseRewritePolicyReadiness', reportName)
    String autoVectorizationVerdict = requireReportValue(report, prefix + 'autoVectorizationReadinessVerdict', reportName)
    String autoVectorizationCanApplyRewrite = requireReportValue(report, prefix + 'autoVectorizationCanApplyRewrite', reportName)
    int autoVectorizationCandidates = parseReportInt(report, prefix + 'autoVectorizationCandidates', reportName)

    if (!['ready', 'blocked'].contains(optimizerVerdict)) {
        throw new GradleException('Unexpected optimizer-readiness verdict for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerVerdict)
    }
    if (!['true', 'false'].contains(optimizerGateBlocked)) {
        throw new GradleException('Unexpected optimizer gate blocked flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerGateBlocked)
    }
    if (!['true', 'false'].contains(autoVectorizationCanApplyRewrite)) {
        throw new GradleException('Unexpected auto-vectorization rewrite flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationCanApplyRewrite)
    }

    boolean blocked = optimizerVerdict == 'blocked'
    if (blocked && firstBlockingLayer == 'none') {
        throw new GradleException('Blocked optimizer-readiness entry is missing first blocker for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (!blocked && firstBlockingLayer != 'none') {
        throw new GradleException('Ready optimizer-readiness entry unexpectedly has first blocker for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + firstBlockingLayer)
    }
    if (blocked && blockingLayers.isBlank()) {
        throw new GradleException('Blocked optimizer-readiness entry is missing blocking layer list for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }

    if (autoVectorizationCanApplyRewrite == 'true') {
        throw new GradleException('Dogfooding optimizer-readiness reports must stay read-only until production mutation is explicitly enabled: '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (autoVectorizationCandidates < 0) {
        throw new GradleException('Negative auto-vectorization candidate count for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationCandidates)
    }
    if (optimizerGateBlocked == 'true' && optimizerGateSource == 'none') {
        throw new GradleException('Blocked optimizer gate is missing source for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (optimizerGateBlocked == 'true' && optimizerGateFamily == 'none') {
        throw new GradleException('Blocked optimizer gate is missing family for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (optimizerGateBlocked == 'false' && optimizerGateSource != 'none') {
        throw new GradleException('Unblocked optimizer gate unexpectedly has source for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerGateSource)
    }
    if (optimizerGateBlocked == 'false' && optimizerGateFamily != 'none') {
        throw new GradleException('Unblocked optimizer gate unexpectedly has family for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerGateFamily)
    }

    boolean csePolicyBlocked = optimizerGateSource == 'cseRewritePolicy'
    if (csePolicyBlocked && cseRewritePolicyReadiness != 'blockedBySkippedCandidate') {
        throw new GradleException('CSE rewrite policy gate must expose skipped-candidate readiness for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + cseRewritePolicyReadiness)
    }
    boolean cseLiteralPromotionBlocked = blockingLayers.contains('cseLiteralPromotion')
    boolean autoVectorizationBlocked = blockingLayers.contains('autoVectorization')
    boolean readOnlyBlocked = blocked && !csePolicyBlocked && cseLiteralPromotionBlocked && autoVectorizationBlocked
    if (readOnlyBlocked && autoVectorizationVerdict != 'notReady/noCandidates') {
        throw new GradleException('Read-only optimizer blocker should report no auto-vectorization candidates for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationVerdict)
    }
    if (cseLayerVerdict == 'blocked' && !csePolicyBlocked) {
        throw new GradleException('Blocked CSE layer must be reflected in the optimizer gate for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }

    return new OptimizerReadinessContractResult(
            blocked,
            readOnlyBlocked,
            csePolicyBlocked,
            cseLiteralPromotionBlocked,
            autoVectorizationBlocked
    )
}

private static String requireReportValue(Properties report, String key, String reportName) {
    String value = report.getProperty(key)
    if (value == null) {
        throw new GradleException('Missing IR validation report key for ' + reportName + ': ' + key)
    }
    return value
}

class OptimizerReadinessContractResult {
    final boolean blocked
    final boolean readOnlyBlocked
    final boolean csePolicyBlocked
    final boolean cseLiteralPromotionBlocked
    final boolean autoVectorizationBlocked

    OptimizerReadinessContractResult(
            boolean blocked,
            boolean readOnlyBlocked,
            boolean csePolicyBlocked,
            boolean cseLiteralPromotionBlocked,
            boolean autoVectorizationBlocked
    ) {
        this.blocked = blocked
        this.readOnlyBlocked = readOnlyBlocked
        this.csePolicyBlocked = csePolicyBlocked
        this.cseLiteralPromotionBlocked = cseLiteralPromotionBlocked
        this.autoVectorizationBlocked = autoVectorizationBlocked
    }
}
