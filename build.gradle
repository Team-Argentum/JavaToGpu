plugins {
    id 'base'
}

// Новое поколение проекта (см. REWORK_ARCHITECTURE.md). Прежний код — в теге legacy-alpha5.
group = 'io.github.deussixik'
version = '0.2.0-SNAPSHOT'

def JAVA_VERSION = 25
def JUNIT_BOM = 'org.junit:junit-bom:6.1.3'

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(JAVA_VERSION)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = JAVA_VERSION
        options.compilerArgs += ['-parameters', '-Xlint:all']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencies {
        testImplementation platform(JUNIT_BOM)
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // FFM (java.lang.foreign) в runtime требует доступа к нативному коду.
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}

// ---------------------------------------------------------------------------------------------
// Границы модулей (REWORK_ARCHITECTURE.md, разделы 4 и 11).
// 1) Допустимые зависимости между модулями; 2) допустимые внешние библиотеки;
// 3) запрещённые импорты JDK/чужих модулей в исходниках ядра.
// Нарушение = сборка (check) падает.
// ---------------------------------------------------------------------------------------------
def allowedProjectDeps = [
        'api'           : [],
        'ir'            : [],
        'ir-interpreter': ['ir'],
        'ir-optimizer'  : ['ir'],
        'codegen-opencl': ['ir'],
        'runtime'       : ['api', 'ir', 'ir-optimizer', 'codegen-opencl'],
        'frontend-java' : ['api', 'ir'],
        'weaver'        : [],
        'gradle-plugin' : ['weaver'],
        'test-support'  : ['api', 'ir', 'ir-interpreter', 'runtime'],
        'tools'         : ['ir', 'codegen-opencl', 'ir-interpreter', 'runtime'],
        'app'           : ['api', 'runtime', 'frontend-java'],
]

// Внешние библиотеки (production-конфигурации). Всё остальное запрещено.
def allowedExternalGroups = [
        'weaver'       : ['org.ow2.asm'],
        'test-support' : ['org.junit'],
]

// Модули «чистого ядра»: данные и чистые функции, без файлового ввода-вывода и нативов.
def pureCore = ['ir', 'ir-optimizer', 'codegen-opencl']
def coreModules = ['api', 'ir', 'ir-optimizer', 'ir-interpreter', 'codegen-opencl']

def forbiddenInCore = [
        'java.lang.foreign', 'javax.annotation.processing', 'javax.lang.model', 'javax.tools',
        'com.sun.', 'org.objectweb.', 'org.lwjgl.',
        'com.sixik.gpu.runtime', 'com.sixik.gpu.frontend', 'com.sixik.gpu.weaver', 'com.sixik.gpu.tools',
]
def forbiddenInPureCore = ['java.nio.file', 'java.io.File', 'java.net.']

tasks.register('verifyModuleBoundaries') {
    group = 'verification'
    description = 'Checks the module dependency graph and forbidden imports (REWORK_ARCHITECTURE.md, sec. 4, 11).'
    doLast {
        def violations = []
        def productionConfigs = ['api', 'implementation', 'compileOnly', 'runtimeOnly', 'annotationProcessor']

        rootProject.subprojects.each { sp ->
            def name = sp.name
            if (!allowedProjectDeps.containsKey(name)) {
                violations << "module '${name}' is not described in allowedProjectDeps (build.gradle)"
                return
            }
            productionConfigs.each { cfgName ->
                def cfg = sp.configurations.findByName(cfgName)
                if (cfg == null) return
                cfg.dependencies.each { dep ->
                    if (dep instanceof ProjectDependency) {
                        def target = dep.path.substring(dep.path.lastIndexOf(':') + 1)
                        if (!allowedProjectDeps[name].contains(target)) {
                            violations << "${name}: forbidden dependency on module '${target}' (configuration ${cfgName})"
                        }
                    } else {
                        def group = dep.group ?: ''
                        def ok = (allowedExternalGroups[name] ?: []).any { group.startsWith(it) }
                        if (!ok) {
                            violations << "${name}: forbidden external dependency ${group}:${dep.name} (configuration ${cfgName})"
                        }
                    }
                }
            }

            // Импорты в исходниках.
            def forbidden = []
            if (coreModules.contains(name)) forbidden += forbiddenInCore
            if (pureCore.contains(name)) forbidden += forbiddenInPureCore
            if (!forbidden.isEmpty()) {
                sp.fileTree('src/main/java').matching { include '**/*.java' }.each { f ->
                    f.eachLine { line, idx ->
                        def m = (line =~ /^\s*import\s+(?:static\s+)?([\w.]+)/)
                        if (m.find()) {
                            def imported = m.group(1)
                            forbidden.each { prefix ->
                                if (imported.startsWith(prefix)) {
                                    violations << "${name}: ${sp.relativePath(f)}:${idx} forbidden import ${imported}"
                                }
                            }
                        }
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("Module boundaries violated:\n  - " + violations.join('\n  - '))
        }
        println "Module boundaries: ${rootProject.subprojects.size()} modules, no violations"
    }
}

tasks.named('check') {
    dependsOn 'verifyModuleBoundaries'
}

// Локальная публикация для самостоятельного примера и проверки Maven-метаданных.
apply from: 'gradle/publishing.gradle'
