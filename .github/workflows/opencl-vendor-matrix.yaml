name: OpenCL Vendor Matrix

on:
  workflow_dispatch:
    inputs:
      source_promotion_baseline_mode:
        description: 'Source-promotion workload baseline mode: skip, advisory, strict, or update.'
        required: false
        default: advisory
        type: choice
        options:
          - skip
          - advisory
          - strict
          - update
      launch_advisory_negative_fixture:
        description: 'Force an expected per-kernel launch-advisory regression without saving the cache baseline.'
        required: false
        default: false
        type: boolean
      validation_lane:
        description: 'OpenCL vendor lane to run.'
        required: false
        default: all
        type: choice
        options:
          - all
          - nvidia
          - amd
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: opencl-vendor-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencl-vendor-matrix:
    name: OpenCL ${{ matrix.vendor_name }} / ${{ matrix.device_name }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          github.event.inputs.validation_lane == 'nvidia' &&
          '{"include":[{"vendor":"nvidia","vendor_name":"NVIDIA","device_name":"RTX 5070","artifact_suffix":"nvidia-rtx5070","runner_labels":["self-hosted","Windows","X64","nvidia","rtx5070"],"routine_task":":processor:openClNvidiaRoutine"}]}'
          || github.event.inputs.validation_lane == 'amd' &&
          '{"include":[{"vendor":"amd","vendor_name":"AMD","device_name":"RX 7800 XT","artifact_suffix":"amd-rx7800xt","runner_labels":["self-hosted","Windows","X64","amd","rx7800xt"],"routine_task":":processor:openClOperationalRoutine"}]}'
          ||
          '{"include":[{"vendor":"amd","vendor_name":"AMD","device_name":"RX 7800 XT","artifact_suffix":"amd-rx7800xt","runner_labels":["self-hosted","Windows","X64","amd","rx7800xt"],"routine_task":":processor:openClOperationalRoutine"},{"vendor":"nvidia","vendor_name":"NVIDIA","device_name":"RTX 5070","artifact_suffix":"nvidia-rtx5070","runner_labels":["self-hosted","Windows","X64","nvidia","rtx5070"],"routine_task":":processor:openClNvidiaRoutine"}]}'
        ) }}

    runs-on: ${{ matrix.runner_labels }}
    timeout-minutes: 90

    env:
      JTG_VALIDATION_VENDOR: ${{ matrix.vendor }}
      JTG_VALIDATION_DEVICE: ${{ matrix.device_name }}
      JTG_OPENCL_CI: 'true'
      JTG_SOURCE_PROMOTION_BASELINE_MODE: ${{ github.event.inputs.source_promotion_baseline_mode || 'advisory' }}
      JTG_LAUNCH_ADVISORY_NEGATIVE_FIXTURE: ${{ github.event.inputs.launch_advisory_negative_fixture || 'false' }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

    steps:
      - name: Add Git for Windows to PATH
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" echo C:\Program Files\Git\cmd>>"%GITHUB_PATH%"
          if exist "C:\Program Files\Git\bin\git.exe" echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" echo C:\Program Files (x86)\Git\cmd>>"%GITHUB_PATH%"
          where git
          if errorlevel 1 echo Git is not in PATH yet; checkout will use paths added through GITHUB_PATH.

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore OpenCL validation history baseline
        id: validation_history_restore
        uses: actions/cache/restore@v4
        with:
          path: processor/build/opencl-validation-history-cache/
          key: opencl-validation-history-v1-${{ runner.os }}-${{ matrix.artifact_suffix }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            opencl-validation-history-v1-${{ runner.os }}-${{ matrix.artifact_suffix }}-${{ github.ref_name }}-

      - name: Print runner and GPU context
        continue-on-error: true
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Expected vendor: %JTG_VALIDATION_VENDOR%
          echo Expected device: %JTG_VALIDATION_DEVICE%
          where git
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "try { Get-CimInstance Win32_VideoController | Select-Object Name, AdapterCompatibility, DriverVersion | Format-Table -AutoSize } catch { Write-Warning ('Unable to query Win32_VideoController: ' + $_.Exception.Message) }"

      - name: Prepare kernel launch-advisory negative fixture
        if: env.JTG_LAUNCH_ADVISORY_NEGATIVE_FIXTURE == 'true'
        id: launch_advisory_negative_fixture_prepare
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:prepareOpenClKernelLaunchAdvisoryNegativeFixture --console=plain --no-daemon

      - name: OpenCL validation routine
        if: always()
        id: opencl_validation
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat ${{ matrix.routine_task }} --console=plain --no-daemon

      - name: Generate OpenCL validation report
        if: always()
        id: validation_report
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:openClValidationReport --console=plain --no-daemon

      - name: Validate kernel launch-advisory drift
        if: always()
        id: launch_advisory_drift
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:validateOpenClKernelLaunchAdvisoryDrift --console=plain --no-daemon

      - name: Validate compiler-resource drift
        if: always()
        id: compiler_resource_drift
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:validateOpenClCompilerResourceDrift --console=plain --no-daemon

      - name: Validate production promotion explainability
        if: steps.opencl_validation.outcome == 'success'
        id: production_explainability
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:validateOpenClProductionPromotionExplainability --console=plain --no-daemon

      - name: Summarize production promotion explainability
        if: always()
        id: production_explainability_summary
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:summarizeOpenClProductionPromotionExplainability --console=plain --no-daemon

      - name: Check source-promotion workload baseline
        if: always()
        id: source_promotion_baseline
        continue-on-error: true
        shell: cmd
        run: |
          if /I "%JTG_SOURCE_PROMOTION_BASELINE_MODE%"=="skip" goto baseline_skip
          if /I "%JTG_SOURCE_PROMOTION_BASELINE_MODE%"=="update" goto baseline_update
          set "BASELINE_FILE=processor\build\opencl-source-promotion-baselines\backend-source-promotion-workload-baseline.properties"
          if not exist "%BASELINE_FILE%" goto baseline_missing
          .\gradlew.bat :processor:validateOpenClBackendSourcePromotionWorkloadBaseline --console=plain --no-daemon
          exit /b %ERRORLEVEL%

          :baseline_skip
          echo Source-promotion workload baseline check skipped.
          exit /b 0

          :baseline_update
          call .\gradlew.bat :processor:writeOpenClBackendSourcePromotionWorkloadBaseline --console=plain --no-daemon
          exit /b %ERRORLEVEL%

          :baseline_missing
          echo Source-promotion workload baseline is missing at %BASELINE_FILE%.
          if /I "%JTG_SOURCE_PROMOTION_BASELINE_MODE%"=="strict" exit /b 1
          echo Advisory mode allows missing baseline; run workflow_dispatch with source_promotion_baseline_mode=update after reviewing artifacts.
          exit /b 0

      - name: Summarize source-promotion workload
        if: always()
        id: source_promotion_summary
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:summarizeOpenClBackendSourcePromotionWorkload --console=plain --no-daemon

      - name: Stage OpenCL validation history cache
        if: >-
          always() &&
          env.JTG_LAUNCH_ADVISORY_NEGATIVE_FIXTURE != 'true' &&
          steps.opencl_validation.outcome == 'success' &&
          steps.validation_report.outcome == 'success' &&
          steps.launch_advisory_drift.outcome == 'success' &&
          steps.compiler_resource_drift.outcome == 'success'
        id: validation_history_stage
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:stageOpenClValidationHistoryCache --console=plain --no-daemon

      - name: Save OpenCL validation history baseline
        if: steps.validation_history_stage.outcome == 'success'
        id: validation_history_save
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: processor/build/opencl-validation-history-cache/
          key: opencl-validation-history-v1-${{ runner.os }}-${{ matrix.artifact_suffix }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Validate kernel launch-advisory negative fixture outcome
        if: always() && env.JTG_LAUNCH_ADVISORY_NEGATIVE_FIXTURE == 'true'
        id: launch_advisory_negative_fixture_check
        continue-on-error: true
        shell: cmd
        env:
          NEGATIVE_FIXTURE_PREPARE_OUTCOME: ${{ steps.launch_advisory_negative_fixture_prepare.outcome }}
          OPENCL_VALIDATION_OUTCOME: ${{ steps.opencl_validation.outcome }}
          VALIDATION_REPORT_OUTCOME: ${{ steps.validation_report.outcome }}
          LAUNCH_ADVISORY_DRIFT_OUTCOME: ${{ steps.launch_advisory_drift.outcome }}
          COMPILER_RESOURCE_DRIFT_OUTCOME: ${{ steps.compiler_resource_drift.outcome }}
          PRODUCTION_EXPLAINABILITY_OUTCOME: ${{ steps.production_explainability.outcome }}
          PRODUCTION_EXPLAINABILITY_SUMMARY_OUTCOME: ${{ steps.production_explainability_summary.outcome }}
          SOURCE_PROMOTION_BASELINE_OUTCOME: ${{ steps.source_promotion_baseline.outcome }}
          SOURCE_PROMOTION_SUMMARY_OUTCOME: ${{ steps.source_promotion_summary.outcome }}
          VALIDATION_HISTORY_STAGE_OUTCOME: ${{ steps.validation_history_stage.outcome }}
          VALIDATION_HISTORY_SAVE_OUTCOME: ${{ steps.validation_history_save.outcome }}
        run: |
          if /I not "%NEGATIVE_FIXTURE_PREPARE_OUTCOME%"=="success" exit /b 1
          if /I not "%OPENCL_VALIDATION_OUTCOME%"=="success" exit /b 1
          if /I not "%VALIDATION_REPORT_OUTCOME%"=="success" exit /b 1
          if /I not "%LAUNCH_ADVISORY_DRIFT_OUTCOME%"=="failure" exit /b 1
          if /I not "%COMPILER_RESOURCE_DRIFT_OUTCOME%"=="success" exit /b 1
          if /I not "%PRODUCTION_EXPLAINABILITY_OUTCOME%"=="success" exit /b 1
          if /I not "%PRODUCTION_EXPLAINABILITY_SUMMARY_OUTCOME%"=="success" exit /b 1
          if /I not "%SOURCE_PROMOTION_BASELINE_OUTCOME%"=="success" exit /b 1
          if /I not "%SOURCE_PROMOTION_SUMMARY_OUTCOME%"=="success" exit /b 1
          if /I not "%VALIDATION_HISTORY_STAGE_OUTCOME%"=="skipped" exit /b 1
          if /I not "%VALIDATION_HISTORY_SAVE_OUTCOME%"=="skipped" exit /b 1
          echo Negative launch-advisory fixture behaved as expected; cache baseline was not staged or saved.

      - name: Upload OpenCL report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencl-validation-${{ matrix.artifact_suffix }}
          path: |
            processor/build/reports/opencl/
            processor/build/test-results/
            processor/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Write OpenCL lane summary
        if: always()
        shell: cmd
        env:
          NEGATIVE_FIXTURE_PREPARE_OUTCOME: ${{ steps.launch_advisory_negative_fixture_prepare.outcome }}
          NEGATIVE_FIXTURE_CHECK_OUTCOME: ${{ steps.launch_advisory_negative_fixture_check.outcome }}
          OPENCL_VALIDATION_OUTCOME: ${{ steps.opencl_validation.outcome }}
          VALIDATION_REPORT_OUTCOME: ${{ steps.validation_report.outcome }}
          LAUNCH_ADVISORY_DRIFT_OUTCOME: ${{ steps.launch_advisory_drift.outcome }}
          COMPILER_RESOURCE_DRIFT_OUTCOME: ${{ steps.compiler_resource_drift.outcome }}
          PRODUCTION_EXPLAINABILITY_OUTCOME: ${{ steps.production_explainability.outcome }}
          PRODUCTION_EXPLAINABILITY_SUMMARY_OUTCOME: ${{ steps.production_explainability_summary.outcome }}
          SOURCE_PROMOTION_BASELINE_OUTCOME: ${{ steps.source_promotion_baseline.outcome }}
          SOURCE_PROMOTION_SUMMARY_OUTCOME: ${{ steps.source_promotion_summary.outcome }}
          VALIDATION_HISTORY_STAGE_OUTCOME: ${{ steps.validation_history_stage.outcome }}
          VALIDATION_HISTORY_SAVE_OUTCOME: ${{ steps.validation_history_save.outcome }}
        run: |
          if not defined GITHUB_STEP_SUMMARY exit /b 0
          echo ## OpenCL %JTG_VALIDATION_VENDOR% / %JTG_VALIDATION_DEVICE%>>"%GITHUB_STEP_SUMMARY%"
          echo.>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Check ^| Outcome ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| --- ^| --- ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Negative fixture prepare ^| %NEGATIVE_FIXTURE_PREPARE_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Negative fixture contract ^| %NEGATIVE_FIXTURE_CHECK_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| OpenCL validation ^| %OPENCL_VALIDATION_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Validation report ^| %VALIDATION_REPORT_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Launch-advisory drift ^| %LAUNCH_ADVISORY_DRIFT_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Compiler-resource drift ^| %COMPILER_RESOURCE_DRIFT_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Production explainability ^| %PRODUCTION_EXPLAINABILITY_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Production explainability summary ^| %PRODUCTION_EXPLAINABILITY_SUMMARY_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Source-promotion baseline ^| %SOURCE_PROMOTION_BASELINE_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Source-promotion summary ^| %SOURCE_PROMOTION_SUMMARY_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Validation history stage ^| %VALIDATION_HISTORY_STAGE_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          echo ^| Validation history save ^| %VALIDATION_HISTORY_SAVE_OUTCOME% ^|>>"%GITHUB_STEP_SUMMARY%"
          if exist processor\build\reports\opencl\runtime-launch-advisory-summary.md (
            echo.>>"%GITHUB_STEP_SUMMARY%"
            type processor\build\reports\opencl\runtime-launch-advisory-summary.md>>"%GITHUB_STEP_SUMMARY%"
          )

      - name: Fail after artifact capture
        if: >-
          always() &&
          (
            (
              env.JTG_LAUNCH_ADVISORY_NEGATIVE_FIXTURE != 'true' &&
              (
                steps.opencl_validation.outcome != 'success' ||
                steps.validation_report.outcome != 'success' ||
                steps.launch_advisory_drift.outcome != 'success' ||
                steps.compiler_resource_drift.outcome != 'success' ||
                steps.validation_history_stage.outcome == 'failure' ||
                steps.validation_history_save.outcome == 'failure' ||
                steps.production_explainability.outcome != 'success' ||
                steps.production_explainability_summary.outcome != 'success' ||
                steps.source_promotion_summary.outcome != 'success' ||
                (
                  (env.JTG_SOURCE_PROMOTION_BASELINE_MODE == 'strict' || env.JTG_SOURCE_PROMOTION_BASELINE_MODE == 'update') &&
                  steps.source_promotion_baseline.outcome != 'success'
                )
              )
            ) ||
            (
              env.JTG_LAUNCH_ADVISORY_NEGATIVE_FIXTURE == 'true' &&
              steps.launch_advisory_negative_fixture_check.outcome != 'success'
            )
          )
        shell: cmd
        run: |
          echo OpenCL %JTG_VALIDATION_VENDOR% / %JTG_VALIDATION_DEVICE% lane failed after artifact capture.
          exit /b 1
