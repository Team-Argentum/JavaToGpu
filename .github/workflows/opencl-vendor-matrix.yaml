name: OpenCL Vendor Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: opencl-vendor-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  opencl-vendor-matrix:
    name: OpenCL ${{ matrix.vendor_name }} / ${{ matrix.device_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: amd
            vendor_name: AMD
            device_name: RX 7800 XT
            artifact_suffix: amd-rx7800xt
            runner_labels: [self-hosted, Windows, X64, amd, rx7800xt]
            routine_task: :processor:openClOperationalRoutine

          - vendor: nvidia
            vendor_name: NVIDIA
            device_name: RTX 5070
            artifact_suffix: nvidia-rtx5070
            runner_labels: [self-hosted, Windows, X64, nvidia, rtx5070]
            routine_task: :processor:openClNvidiaRoutine

    runs-on: ${{ matrix.runner_labels }}
    timeout-minutes: 90

    env:
      JTG_VALIDATION_VENDOR: ${{ matrix.vendor }}
      JTG_VALIDATION_DEVICE: ${{ matrix.device_name }}
      JTG_OPENCL_CI: 'true'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

    steps:
      - name: Add Git for Windows to PATH
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" (
            echo C:\Program Files\Git\cmd>>"%GITHUB_PATH%"
            set "PATH=C:\Program Files\Git\cmd;%PATH%"
          )
          if exist "C:\Program Files\Git\bin\git.exe" (
            echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
            set "PATH=C:\Program Files\Git\bin;%PATH%"
          )
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" (
            echo C:\Program Files (x86)\Git\cmd>>"%GITHUB_PATH%"
            set "PATH=C:\Program Files (x86)\Git\cmd;%PATH%"
          )
          where git || (
            echo Git for Windows was not found. Install Git 2.18+ on the runner or add git.exe to PATH.
            exit /b 1
          )

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Print runner and GPU context
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Expected vendor: %JTG_VALIDATION_VENDOR%
          echo Expected device: %JTG_VALIDATION_DEVICE%
          where git
          wmic path win32_VideoController get Name,AdapterCompatibility,DriverVersion

      - name: OpenCL validation routine
        id: opencl_validation
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat ${{ matrix.routine_task }} --console=plain --no-daemon

      - name: Generate OpenCL validation report
        if: always()
        id: validation_report
        continue-on-error: true
        shell: cmd
        run: .\gradlew.bat :processor:openClValidationReport --console=plain --no-daemon

      - name: Upload OpenCL report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencl-validation-${{ matrix.artifact_suffix }}
          path: |
            processor/build/reports/opencl/
            processor/build/test-results/
            processor/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after artifact capture
        if: always()
        shell: cmd
        env:
          OPENCL_VALIDATION_OUTCOME: ${{ steps.opencl_validation.outcome }}
          VALIDATION_REPORT_OUTCOME: ${{ steps.validation_report.outcome }}
        run: |
          if not "%OPENCL_VALIDATION_OUTCOME%"=="success" goto failed
          if not "%VALIDATION_REPORT_OUTCOME%"=="success" goto failed
          echo OpenCL %JTG_VALIDATION_VENDOR% / %JTG_VALIDATION_DEVICE% lane passed.
          exit /b 0

          :failed
          echo OpenCL %JTG_VALIDATION_VENDOR% / %JTG_VALIDATION_DEVICE% lane failed after artifact capture: openclValidation=%OPENCL_VALIDATION_OUTCOME%, validationReport=%VALIDATION_REPORT_OUTCOME%
          exit /b 1
