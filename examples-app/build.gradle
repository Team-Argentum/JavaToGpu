def extensionHarnessExampleTaskNames = [
        'runBackendContractReadinessExample',
        'runBackendHookServiceLoaderExample',
        'runBackendHookAuthorizationPreviewExample',
        'runBackendHookAuthorizationValidatorExample',
        'runIrValidationProviderHarnessExample',
        'runRuntimeObservabilityServiceHarnessExample',
        'runDevicePolicyHarnessExample',
        'runCompilerFeedbackHarnessExample'
]

tasks.register('runExtensionHarnessExamples') {
    group = 'verification'
    description = 'Runs all hardware-free extension SPI harness examples.'
    extensionHarnessExampleTaskNames.each { taskName ->
        dependsOn tasks.named(taskName)
    }
}

for (int i = 1; i < extensionHarnessExampleTaskNames.size(); i++) {
    def previousTaskName = extensionHarnessExampleTaskNames[i - 1]
    def currentTaskName = extensionHarnessExampleTaskNames[i]
    tasks.named(currentTaskName) {
        mustRunAfter tasks.named(previousTaskName)
    }
}

