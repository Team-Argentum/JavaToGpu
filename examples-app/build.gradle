plugins {
    id 'java'
    id 'application'
}

group = 'net.sixik.ga_utils'
version = '1.0-SNAPSHOT'

dependencies {
    implementation project(':processor')
    implementation project(':ir-optimizer')
    annotationProcessor project(':processor')
    if (providers.gradleProperty('javatogpu.enableIrValidationExamples').map { it.toBoolean() }.getOrElse(false)) {
        annotationProcessor project(':ir-validation')
    }
    implementation 'com.github.javaparser:javaparser-core:3.28.1'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'net.sixik.ga_utils.examples.ExamplesMain'
}

tasks.register('rewriteGpuMethods', JavaExec) {
    dependsOn project(':processor').tasks.named('classes')
    dependsOn tasks.named('compileJava')
    dependsOn tasks.named('processResources')
    classpath = project(':processor').sourceSets.main.runtimeClasspath + configurations.runtimeClasspath
    mainClass = 'net.sixik.ga_utils.javatogpu.runtime.GpuMethodBodyRewriter'
    args layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
}

tasks.register('runOptimizationJournalExample', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.sixik.ga_utils.examples.OptimizationJournalExample'
    def journalDir = providers.gradleProperty('javatogpu.optimizerJournalDir')
    if (journalDir.isPresent()) {
        args journalDir.get()
    }
    def lifecycleJournalFile = providers.gradleProperty('javatogpu.lifecycleJournalFile')
    if (lifecycleJournalFile.isPresent()) {
        systemProperty 'javatogpu.runtime.lifecycleJournalFile', lifecycleJournalFile.get()
    }
    def lifecycleJournalFormat = providers.gradleProperty('javatogpu.lifecycleJournalFormat')
    if (lifecycleJournalFormat.isPresent()) {
        systemProperty 'javatogpu.runtime.lifecycleJournalFormat', lifecycleJournalFormat.get()
    }
    def exampleLifecycleTraceFile = providers.gradleProperty('javatogpu.exampleLifecycleTraceFile')
    if (exampleLifecycleTraceFile.isPresent()) {
        systemProperty 'javatogpu.examples.lifecycleTraceFile', exampleLifecycleTraceFile.get()
    }
}

