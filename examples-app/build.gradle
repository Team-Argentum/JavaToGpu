tasks.named('classes') {
    dependsOn tasks.named('rewriteGpuMethods')
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    if (providers.gradleProperty('javatogpu.enableIrValidationExamples').map { it.toBoolean() }.getOrElse(false)) {
        options.compilerArgs += [
                '-Ajavatogpu.irValidation=' + providers.gradleProperty('javatogpu.irValidationMode').getOrElse('diagnostic'),
                '-Ajavatogpu.irValidationDiagnostics=' + providers.gradleProperty('javatogpu.irValidationDiagnostics').getOrElse('summary'),
                '-Ajavatogpu.irValidationReport=' + providers.gradleProperty('javatogpu.irValidationReport').getOrElse('reports/examples-app-ir-validation.properties')
        ]
    }
}

tasks.withType(JavaExec).configureEach {
    def runtimeLog = providers.gradleProperty('javatogpu.runtimeLog')
    if (runtimeLog.isPresent()) {
        systemProperty 'javatogpu.runtime.log', runtimeLog.get()
    }
}
