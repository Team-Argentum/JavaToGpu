    String productionReadinessStageVerdicts = requireReportValue(report, prefix + 'optimizerProductionReadinessStageVerdicts', reportName)
    String productionReadinessConsistent = requireReportValue(report, prefix + 'optimizerProductionReadinessConsistent', reportName)
    String productionReadinessAcceptanceAccepted = requireReportValue(report, prefix + 'optimizerProductionReadinessAcceptance.Accepted', reportName)
    String productionReadinessAcceptanceReason = requireReportValue(report, prefix + 'optimizerProductionReadinessAcceptance.Reason', reportName)
    int autoVectorizationCandidates = parseReportInt(report, prefix + 'autoVectorizationCandidates', reportName)

    if (!['ready', 'blocked'].contains(optimizerVerdict)) {
        throw new GradleException('Unexpected optimizer-readiness verdict for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerVerdict)
    }
    if (!['true', 'false'].contains(optimizerGateBlocked)) {
        throw new GradleException('Unexpected optimizer gate blocked flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerGateBlocked)
    }
    if (!['true', 'false'].contains(autoVectorizationCanApplyRewrite)) {
        throw new GradleException('Unexpected auto-vectorization rewrite flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationCanApplyRewrite)
    }
    if (!['bucketed', 'notApplicable'].contains(autoVectorizationNoCandidateReadiness)) {
        throw new GradleException('Unexpected auto-vectorization no-candidate readiness for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationNoCandidateReadiness)
    }
    if (!['true', 'false'].contains(autoVectorizationNoCandidateNoCandidates)) {
        throw new GradleException('Unexpected auto-vectorization no-candidate flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationNoCandidateNoCandidates)
    }
    if (autoVectorizationNoCandidateCandidateCount < 0 || autoVectorizationNoCandidateBucketCount < 0) {
        throw new GradleException('Negative auto-vectorization no-candidate counters for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): candidates=' + autoVectorizationNoCandidateCandidateCount
                + ' buckets=' + autoVectorizationNoCandidateBucketCount)
    }
    if (!['clear', 'blocked'].contains(cseControlFlowRegionReadiness)) {
        throw new GradleException('Unexpected CSE control-flow region readiness for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + cseControlFlowRegionReadiness)
    }
    if (!['true', 'false'].contains(cseControlFlowRegionBlocked)) {
        throw new GradleException('Unexpected CSE control-flow region blocked flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + cseControlFlowRegionBlocked)
    }
    if (cseControlFlowRegionBlockedCandidates < 0) {
        throw new GradleException('Negative CSE control-flow region blocked candidate count for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + cseControlFlowRegionBlockedCandidates)
    }
    boolean cseControlFlowRegionIsBlocked = cseControlFlowRegionReadiness == 'blocked'
    if (cseControlFlowRegionBlocked != Boolean.toString(cseControlFlowRegionIsBlocked)) {
        throw new GradleException('CSE control-flow region blocked flag must match readiness for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): readiness=' + cseControlFlowRegionReadiness
                + ' blocked=' + cseControlFlowRegionBlocked)
    }
    if (cseControlFlowRegionIsBlocked && cseControlFlowRegionBlockedCandidates == 0) {
        throw new GradleException('Blocked CSE control-flow region summary must expose blocked candidates for '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (!cseControlFlowRegionIsBlocked && cseControlFlowRegionBlockedCandidates != 0) {
        throw new GradleException('Clear CSE control-flow region summary unexpectedly has blocked candidates for '
                + reportName + ' entry ' + index + ' (' + methodName + '): ' + cseControlFlowRegionBlockedCandidates)
    }
    if (cseControlFlowRegionIsBlocked && cseControlFlowRegionFirstRemainingWork != 'splitControlFlowRegionsBeforeCse') {
        throw new GradleException('Blocked CSE control-flow region summary must expose remaining work for '
                + reportName + ' entry ' + index + ' (' + methodName + '): ' + cseControlFlowRegionFirstRemainingWork)
    }
    if (!cseControlFlowRegionIsBlocked && cseControlFlowRegionFirstRemainingWork != 'none') {
        throw new GradleException('Clear CSE control-flow region summary unexpectedly has remaining work for '
                + reportName + ' entry ' + index + ' (' + methodName + '): ' + cseControlFlowRegionFirstRemainingWork)
    }
    if (!['ready', 'blocked'].contains(optimizerBlockerVerdict)) {
        throw new GradleException('Unexpected optimizer blocker verdict for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerBlockerVerdict)
    }
    if (!['true', 'false'].contains(optimizerBlockerBlocked)) {
        throw new GradleException('Unexpected optimizer blocker blocked flag for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerBlockerBlocked)
    }

    boolean blocked = optimizerVerdict == 'blocked'
    boolean optimizerBlockerIsBlocked = optimizerBlockerVerdict == 'blocked'
    if (blocked && firstBlockingLayer == 'none') {
        throw new GradleException('Blocked optimizer-readiness entry is missing first blocker for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (!blocked && firstBlockingLayer != 'none') {
        throw new GradleException('Ready optimizer-readiness entry unexpectedly has first blocker for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + firstBlockingLayer)
    }
    if (blocked && blockingLayers.isBlank()) {
        throw new GradleException('Blocked optimizer-readiness entry is missing blocking layer list for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (optimizerBlockerIsBlocked != blocked) {
        throw new GradleException('Optimizer blocker index verdict must match optimizer readiness for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): readiness=' + optimizerVerdict
                + ' blocker=' + optimizerBlockerVerdict)
    }
    if (optimizerBlockerBlocked != Boolean.toString(optimizerBlockerIsBlocked)) {
        throw new GradleException('Optimizer blocker index blocked flag must match verdict for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): verdict=' + optimizerBlockerVerdict
                + ' blocked=' + optimizerBlockerBlocked)
    }
    if (blocked && optimizerBlockerSource == 'none') {
        throw new GradleException('Blocked optimizer-readiness entry is missing optimizer blocker source for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (blocked && optimizerBlockerFamily == 'none') {
        throw new GradleException('Blocked optimizer-readiness entry is missing optimizer blocker family for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (blocked && optimizerBlockerRemainingWork == 'none') {
        throw new GradleException('Blocked optimizer-readiness entry is missing optimizer blocker remaining work for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (!blocked && optimizerBlockerSource != 'none') {
        throw new GradleException('Ready optimizer-readiness entry unexpectedly has optimizer blocker source for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerBlockerSource)
    }
    if (!blocked && optimizerBlockerFamily != 'none') {
        throw new GradleException('Ready optimizer-readiness entry unexpectedly has optimizer blocker family for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerBlockerFamily)
    }
    if (!optimizerBlockerCiSummaryLine.contains('method=' + methodName)
            || !optimizerBlockerSummary.contains('method=' + methodName)) {
        throw new GradleException('Optimizer blocker index summaries must include method identity for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }

    if (readinessBaselineCiMethod != methodName || blockerBaselineSnapshotMethod != methodName
            || blockerBaselineComparisonMethod != methodName) {
        throw new GradleException('Optimizer baseline CI fields must include matching method identity for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (!['unchanged', 'improved', 'changed'].contains(readinessBaselineCiOutcome)) {
        throw new GradleException('Unexpected optimizer readiness baseline CI outcome for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + readinessBaselineCiOutcome)
    }
    if (readinessBaselineCiDecision != 'accepted/noRegression' || readinessBaselineCiFailBuild != 'false') {
        throw new GradleException('Dogfooding optimizer readiness baseline must not fail the build for self-baseline reports: '
                + reportName + ' entry ' + index + ' (' + methodName + ') decision=' + readinessBaselineCiDecision
                + ' failBuild=' + readinessBaselineCiFailBuild)
    }
    if (blockerBaselineSnapshotVerdict != optimizerBlockerVerdict
            || blockerBaselineSnapshotSource != optimizerBlockerSource
            || blockerBaselineSnapshotFamily != optimizerBlockerFamily
            || blockerBaselineSnapshotRemainingWork != optimizerBlockerRemainingWork) {
        throw new GradleException('Optimizer blocker baseline snapshot must mirror current blocker index for self-baseline reports: '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (blockerBaselineComparisonOutcome == 'regressed') {
        throw new GradleException('Optimizer blocker baseline comparison regressed for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (blockerBaselineComparisonBaselineScore != blockerBaselineComparisonCurrentScore
            || blockerBaselineComparisonScoreDelta != 0) {
        throw new GradleException('Optimizer blocker baseline comparison score must compare self-baseline scores for '
                + reportName + ' entry ' + index + ' (' + methodName + '): baselineScore='
                + blockerBaselineComparisonBaselineScore + ' currentScore=' + blockerBaselineComparisonCurrentScore
                + ' scoreDelta=' + blockerBaselineComparisonScoreDelta)
    }
    if (blockerBaselineComparisonSourceTransition != optimizerBlockerSource + '->' + optimizerBlockerSource
            || blockerBaselineComparisonFamilyTransition != optimizerBlockerFamily + '->' + optimizerBlockerFamily
            || blockerBaselineComparisonRemainingWorkTransition != optimizerBlockerRemainingWork + '->' + optimizerBlockerRemainingWork) {
        throw new GradleException('Optimizer blocker baseline comparison must compare self-baseline transitions for '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }

    if (productionReadinessMethod != methodName) {
        throw new GradleException('Optimizer production readiness method must match report entry for '
                + reportName + ' entry ' + index + ' (' + methodName + '): ' + productionReadinessMethod)
    }
    if (!['true', 'false'].contains(productionReadinessBlocked)
            || !['true', 'false'].contains(productionReadinessProductionMutationEnabled)
            || !['true', 'false'].contains(productionReadinessPromotionAllowed)
            || !['true', 'false'].contains(productionReadinessConsistent)
            || !['true', 'false'].contains(productionReadinessAcceptanceAccepted)) {
        throw new GradleException('Optimizer production readiness boolean fields must be true/false for '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (productionReadinessProductionMutationEnabled != 'false' || productionReadinessPromotionAllowed != 'false') {
        throw new GradleException('Dogfooding production readiness must stay read-only until production mutation is explicitly enabled: '
                + reportName + ' entry ' + index + ' (' + methodName + ') mutationEnabled='
                + productionReadinessProductionMutationEnabled + ' promotionAllowed=' + productionReadinessPromotionAllowed)
    }
    if (productionReadinessConsistent != 'true') {
        throw new GradleException('Optimizer production readiness artifact must be internally consistent for '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (blocked && productionReadinessBlocked != 'true') {
        throw new GradleException('Blocked optimizer readiness must keep production readiness blocked for '
                + reportName + ' entry ' + index + ' (' + methodName + '): ' + productionReadinessBlocked)
    }
    if (blocked && productionReadinessFirstBlockingStage == 'none') {
        throw new GradleException('Blocked production readiness must expose first blocking stage for '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (blocked && !productionReadinessStageVerdicts.contains('bundle=' + productionReadinessBundleVerdict)) {
        throw new GradleException('Optimizer production readiness stage verdict summary must include bundle verdict for '
                + reportName + ' entry ' + index + ' (' + methodName + '): stageVerdicts=' + productionReadinessStageVerdicts
                + ' bundleVerdict=' + productionReadinessBundleVerdict)
    }
    if (productionReadinessVerdict == 'ready/selectedRewritePromotionAllowed') {
        throw new GradleException('Dogfooding production readiness must not allow selected rewrite promotion yet for '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (productionReadinessAcceptanceAccepted != 'false'
            || !productionReadinessAcceptanceReason.startsWith('rejected/')) {
        throw new GradleException('Dogfooding production readiness acceptance must reject current read-only artifacts for '
                + reportName + ' entry ' + index + ' (' + methodName + '): accepted='
                + productionReadinessAcceptanceAccepted + ' reason=' + productionReadinessAcceptanceReason)
    }

    if (autoVectorizationCanApplyRewrite == 'true') {
        throw new GradleException('Dogfooding optimizer-readiness reports must stay read-only until production mutation is explicitly enabled: '
                + reportName + ' entry ' + index + ' (' + methodName + ')')
    }
    if (autoVectorizationCandidates < 0) {
        throw new GradleException('Negative auto-vectorization candidate count for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationCandidates)
    }
    if (autoVectorizationNoCandidateCandidateCount != autoVectorizationCandidates) {
        throw new GradleException('Auto-vectorization no-candidate candidate count must mirror preview candidates for '
                + reportName + ' entry ' + index + ' (' + methodName + '): noCandidateCandidates='
                + autoVectorizationNoCandidateCandidateCount + ' previewCandidates=' + autoVectorizationCandidates)
    }
    if (autoVectorizationCandidates == 0) {
        if (autoVectorizationNoCandidateReadiness != 'bucketed'
                || autoVectorizationNoCandidateNoCandidates != 'true'
                || autoVectorizationNoCandidateBucketCount == 0
                || autoVectorizationNoCandidateFirstBucket == 'none'
                || autoVectorizationNoCandidateFirstRemainingWork == 'none'
                || autoVectorizationNoCandidateFirstExampleBucket == 'none'
                || autoVectorizationNoCandidateFirstExampleLocation == 'none'
                || autoVectorizationNoCandidateFirstExample == 'none'
                || autoVectorizationNoCandidateDiagnosticCode == 'none'
                || autoVectorizationNoCandidateFirstHelp == 'none') {
            throw new GradleException('Zero-candidate auto-vectorization entries must expose actionable no-candidate buckets for '
                    + reportName + ' entry ' + index + ' (' + methodName + '): readiness='
                    + autoVectorizationNoCandidateReadiness + ' noCandidates=' + autoVectorizationNoCandidateNoCandidates
                    + ' bucketCount=' + autoVectorizationNoCandidateBucketCount + ' firstBucket='
                    + autoVectorizationNoCandidateFirstBucket + ' firstRemainingWork='
                    + autoVectorizationNoCandidateFirstRemainingWork + ' firstExampleBucket='
                    + autoVectorizationNoCandidateFirstExampleBucket + ' firstExampleLocation='
                    + autoVectorizationNoCandidateFirstExampleLocation + ' firstExample='
                    + autoVectorizationNoCandidateFirstExample + ' diagnosticCode='
                    + autoVectorizationNoCandidateDiagnosticCode + ' firstHelp='
                    + autoVectorizationNoCandidateFirstHelp)
        }
        if (autoVectorizationNoCandidateDiagnosticCode != 'JTG-IR-AV-001') {
            throw new GradleException('Zero-candidate auto-vectorization diagnostic code must be stable for '
                    + reportName + ' entry ' + index + ' (' + methodName + '): '
                    + autoVectorizationNoCandidateDiagnosticCode)
        }
        if (autoVectorizationNoCandidateFirstExampleBucket != autoVectorizationNoCandidateFirstBucket) {
            throw new GradleException('Zero-candidate auto-vectorization first example bucket must match first bucket for '
                    + reportName + ' entry ' + index + ' (' + methodName + '): firstBucket='
                    + autoVectorizationNoCandidateFirstBucket + ' firstExampleBucket='
                    + autoVectorizationNoCandidateFirstExampleBucket)
        }
        if (!autoVectorizationNoCandidateFirstExample.contains(methodName + '@')) {
            throw new GradleException('Zero-candidate auto-vectorization first example must include method-qualified location for '
                    + reportName + ' entry ' + index + ' (' + methodName + '): '
                    + autoVectorizationNoCandidateFirstExample)
        }
    } else if (autoVectorizationNoCandidateReadiness != 'notApplicable'
            || autoVectorizationNoCandidateNoCandidates != 'false'
            || autoVectorizationNoCandidateFirstBucket != 'none'
            || autoVectorizationNoCandidateFirstExample != 'none'
            || autoVectorizationNoCandidateDiagnosticCode != 'none'
            || autoVectorizationNoCandidateFirstHelp != 'none') {
        throw new GradleException('Candidate-bearing auto-vectorization entries must not expose no-candidate buckets for '
                + reportName + ' entry ' + index + ' (' + methodName + '): readiness='
                + autoVectorizationNoCandidateReadiness + ' firstBucket=' + autoVectorizationNoCandidateFirstBucket
                + ' firstExample=' + autoVectorizationNoCandidateFirstExample + ' diagnosticCode='
                + autoVectorizationNoCandidateDiagnosticCode + ' firstHelp=' + autoVectorizationNoCandidateFirstHelp)
    }
    if (optimizerGateBlocked == 'true' && optimizerGateSource == 'none') {
        throw new GradleException('Blocked optimizer gate is missing source for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (optimizerGateBlocked == 'true' && optimizerGateFamily == 'none') {
        throw new GradleException('Blocked optimizer gate is missing family for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (optimizerGateBlocked == 'false' && optimizerGateSource != 'none') {
        throw new GradleException('Unblocked optimizer gate unexpectedly has source for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerGateSource)
    }
    if (optimizerGateBlocked == 'false' && optimizerGateFamily != 'none') {
        throw new GradleException('Unblocked optimizer gate unexpectedly has family for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerGateFamily)
    }

    boolean csePolicyBlocked = optimizerGateSource == 'cseRewritePolicy'
    if (csePolicyBlocked && cseRewritePolicyReadiness != 'blockedBySkippedCandidate') {
        throw new GradleException('CSE rewrite policy gate must expose skipped-candidate readiness for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + cseRewritePolicyReadiness)
    }
    if (csePolicyBlocked && optimizerBlockerSource != 'cseRewritePolicy') {
        throw new GradleException('CSE rewrite policy blocker must be the first optimizer blocker for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerBlockerSource)
    }
    if (csePolicyBlocked && optimizerBlockerCseFamily == 'none') {
        throw new GradleException('CSE rewrite policy blocker must expose CSE blocker family for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    boolean cseLiteralPromotionBlocked = blockingLayers.contains('cseLiteralPromotion')
    boolean autoVectorizationBlocked = blockingLayers.contains('autoVectorization')
    boolean readOnlyBlocked = blocked && !csePolicyBlocked && cseLiteralPromotionBlocked && autoVectorizationBlocked
    if (readOnlyBlocked && autoVectorizationVerdict != 'notReady/noCandidates') {
        throw new GradleException('Read-only optimizer blocker should report no auto-vectorization candidates for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + autoVectorizationVerdict)
    }
    if (readOnlyBlocked && optimizerBlockerSource != 'autoVectorization') {
        throw new GradleException('Read-only optimizer blocker must point to auto-vectorization when CSE policy is clear for ' + reportName
                + ' entry ' + index + ' (' + methodName + '): ' + optimizerBlockerSource)
    }
    if (autoVectorizationBlocked && optimizerBlockerAutoVectorizationFamily == 'none') {
        throw new GradleException('Auto-vectorization blocker must expose auto-vectorization blocker family for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }
    if (cseLayerVerdict == 'blocked' && !csePolicyBlocked) {
        throw new GradleException('Blocked CSE layer must be reflected in the optimizer gate for ' + reportName
                + ' entry ' + index + ' (' + methodName + ')')
    }

    return new OptimizerReadinessContractResult(
            blocked,
            readOnlyBlocked,
            csePolicyBlocked,
            cseLiteralPromotionBlocked,
            autoVectorizationBlocked,
            optimizerBlockerSource,
            optimizerBlockerFamily,
            productionReadinessFirstBlockingStage,
            autoVectorizationNoCandidateFirstBucket,
            autoVectorizationNoCandidateDiagnosticCode
    )
}

private static String requireReportValue(Properties report, String key, String reportName) {
    String value = report.getProperty(key)
    if (value == null) {
        throw new GradleException('Missing IR validation report key for ' + reportName + ': ' + key)
    }
    return value
}

class OptimizerReadinessContractResult {
    final boolean blocked
    final boolean readOnlyBlocked
    final boolean csePolicyBlocked
    final boolean cseLiteralPromotionBlocked
    final boolean autoVectorizationBlocked
    final String optimizerBlockerSource
    final String optimizerBlockerFamily
    final String productionReadinessFirstBlockingStage
    final String autoVectorizationNoCandidateFirstBucket
    final String autoVectorizationNoCandidateDiagnosticCode

    OptimizerReadinessContractResult(
            boolean blocked,
            boolean readOnlyBlocked,
            boolean csePolicyBlocked,
            boolean cseLiteralPromotionBlocked,
            boolean autoVectorizationBlocked,
            String optimizerBlockerSource,
            String optimizerBlockerFamily,
            String productionReadinessFirstBlockingStage,
            String autoVectorizationNoCandidateFirstBucket,
            String autoVectorizationNoCandidateDiagnosticCode
    ) {
        this.blocked = blocked
        this.readOnlyBlocked = readOnlyBlocked
        this.csePolicyBlocked = csePolicyBlocked
        this.cseLiteralPromotionBlocked = cseLiteralPromotionBlocked
        this.autoVectorizationBlocked = autoVectorizationBlocked
        this.optimizerBlockerSource = optimizerBlockerSource
        this.optimizerBlockerFamily = optimizerBlockerFamily
        this.productionReadinessFirstBlockingStage = productionReadinessFirstBlockingStage
        this.autoVectorizationNoCandidateFirstBucket = autoVectorizationNoCandidateFirstBucket
        this.autoVectorizationNoCandidateDiagnosticCode = autoVectorizationNoCandidateDiagnosticCode
    }
}

class IrValidationHealthSummary {
    final int entries
    final int safetyOk
    final int safetyFailed
    final int optimizerBlocked
    final int readOnlyBlocked
    final Map<String, Integer> optimizerBlockerSourceCounts
    final Map<String, Integer> productionReadinessStageCounts
    final Map<String, Integer> noCandidateBucketCounts
    final Map<String, Integer> noCandidateDiagnosticCodeCounts

    IrValidationHealthSummary(
            int entries,
            int safetyOk,
            int safetyFailed,
            int optimizerBlocked,
            int readOnlyBlocked,
            Map<String, Integer> optimizerBlockerSourceCounts,
            Map<String, Integer> productionReadinessStageCounts,
            Map<String, Integer> noCandidateBucketCounts,
            Map<String, Integer> noCandidateDiagnosticCodeCounts
    ) {
        this.entries = entries
        this.safetyOk = safetyOk
        this.safetyFailed = safetyFailed
        this.optimizerBlocked = optimizerBlocked
        this.readOnlyBlocked = readOnlyBlocked
        this.optimizerBlockerSourceCounts = new LinkedHashMap<>(optimizerBlockerSourceCounts)
        this.productionReadinessStageCounts = new LinkedHashMap<>(productionReadinessStageCounts)
        this.noCandidateBucketCounts = new LinkedHashMap<>(noCandidateBucketCounts)
        this.noCandidateDiagnosticCodeCounts = new LinkedHashMap<>(noCandidateDiagnosticCodeCounts)
    }

    String ciSummaryLine(String reportName) {
        return ('irValidationHealth report=' + reportName
                + ' entries=' + entries
                + ' safetyFailed=' + safetyFailed
                + ' optimizerBlocked=' + optimizerBlocked
                + ' readOnlyBlocked=' + readOnlyBlocked
                + ' blockerSources=' + countSummary(optimizerBlockerSourceCounts)
                + ' productionStages=' + countSummary(productionReadinessStageCounts)
                + ' diagnosticCodes=' + countSummary(noCandidateDiagnosticCodeCounts)
                + ' firstBuckets=' + countSummary(noCandidateBucketCounts))
    }

    private static String countSummary(Map<String, Integer> counts) {
        if (counts.isEmpty()) {
            return '{}'
        }
        return '{' + counts.collect { key, value -> key + '=' + value }.join(',') + '}'
    }
}
