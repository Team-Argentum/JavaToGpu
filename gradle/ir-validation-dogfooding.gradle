def irValidationExamplesEnabled = providers.gradleProperty('javatogpu.enableIrValidationExamples')
        .map { it.toBoolean() }
        .getOrElse(false)

def irValidationExampleReports = [
        [
                name      : 'examples-app',
                compile   : ':examples-app:compileJava',
                reportFile: layout.projectDirectory.file('examples-app/build/generated/sources/annotationProcessor/java/main/reports/examples-app-ir-validation.properties')
        ],
        [
                name      : 'test-app',
                compile   : ':test-app:compileJava',
                reportFile: layout.projectDirectory.file('test-app/build/generated/sources/annotationProcessor/java/main/reports/test-app-ir-validation.properties')
        ]
]

def irValidationBaselineDirectory = providers.gradleProperty('javatogpu.irValidationBaselineDir')
        .map { layout.projectDirectory.dir(it) }
        .orElse(layout.buildDirectory.dir('ir-validation-baselines'))

def irValidationHealthSummaryFile = layout.buildDirectory.file('reports/ir-validation/health-summary.properties')

tasks.register('validateIrValidationExampleReports') {
    group = 'verification'
    description = 'Verifies opt-in IR validation dogfooding reports for safety and read-only optimizer-readiness stability.'
    dependsOn irValidationExampleReports.collect { it.compile }
    inputs.files(irValidationExampleReports.collect { it.reportFile })

    doLast {
        if (!irValidationExamplesEnabled) {
            throw new GradleException(
                    'IR validation example report contract requires --project-prop javatogpu.enableIrValidationExamples=true'
            )
        }

        irValidationExampleReports.each { reportSpec ->
            File reportFile = reportSpec.reportFile.asFile
            if (!reportFile.isFile()) {
                throw new GradleException('Missing IR validation dogfooding report for ' + reportSpec.name + ': ' + reportFile)
            }

            Properties report = new Properties()
            reportFile.withInputStream { stream -> report.load(stream) }

            if (report.getProperty('format') != 'javatogpu.ir.validation.v1') {
                throw new GradleException('Unexpected IR validation report format for ' + reportSpec.name + ': '
                        + report.getProperty('format'))
            }

            int entryCount = parseReportInt(report, 'entry.count', reportSpec.name)
            int safetyOk = 0
            int optimizerBlocked = 0
            int optimizerReadOnlyBlocked = 0
            int csePolicyBlocked = 0
            int cseLiteralPromotionBlocked = 0
            int autoVectorizationBlocked = 0
            Map<String, Integer> optimizerBlockerSourceCounts = new LinkedHashMap<>()
            Map<String, Integer> optimizerBlockerFamilyCounts = new LinkedHashMap<>()
            Map<String, Integer> productionReadinessStageCounts = new LinkedHashMap<>()
            Map<String, Integer> autoVectorizationNoCandidateBucketCounts = new LinkedHashMap<>()
            Map<String, Integer> autoVectorizationNoCandidateDiagnosticCodeCounts = new LinkedHashMap<>()
            java.util.List<String> failures = []
            for (int index = 0; index < entryCount; index++) {
                String safety = report.getProperty('entry.' + index + '.safety')
                if (safety == 'ok') {
                    safetyOk++
                } else if (safety == 'failed') {
                    String methodName = report.getProperty('entry.' + index + '.methodName', '<unknown>')
                    String safetyError = report.getProperty('entry.' + index + '.safetyError', '<missing safetyError>')
                    failures.add(methodName + ': ' + safetyError)
                } else {
                    throw new GradleException('Unexpected IR validation safety state for ' + reportSpec.name
                            + ' entry ' + index + ': ' + safety)
                }

                OptimizerReadinessContractResult optimizerResult = validateOptimizerReadinessContract(
                        report,
                        reportSpec.name,
                        index
                )
                if (optimizerResult.blocked) {
                    optimizerBlocked++
                }
                if (optimizerResult.readOnlyBlocked) {
                    optimizerReadOnlyBlocked++
                }
                if (optimizerResult.csePolicyBlocked) {
                    csePolicyBlocked++
                }
                if (optimizerResult.cseLiteralPromotionBlocked) {
                    cseLiteralPromotionBlocked++
                }
                if (optimizerResult.autoVectorizationBlocked) {
                    autoVectorizationBlocked++
                }
                incrementCount(optimizerBlockerSourceCounts, optimizerResult.optimizerBlockerSource)
                incrementCount(optimizerBlockerFamilyCounts, optimizerResult.optimizerBlockerFamily)
                incrementCount(productionReadinessStageCounts, optimizerResult.productionReadinessFirstBlockingStage)
                incrementCount(autoVectorizationNoCandidateBucketCounts, optimizerResult.autoVectorizationNoCandidateFirstBucket)
                incrementCount(autoVectorizationNoCandidateDiagnosticCodeCounts, optimizerResult.autoVectorizationNoCandidateDiagnosticCode)
            }

            validateAutoVectorizationNoCandidateDiagnosticCodeRollup(
                    report,
                    reportSpec.name,
                    autoVectorizationNoCandidateDiagnosticCodeCounts
            )

            if (!failures.isEmpty()) {
                throw new GradleException('IR validation dogfooding safety contract failed for ' + reportSpec.name
                        + ' (' + failures.size() + '/' + entryCount + ' failed): ' + failures.join('; '))
            }

            logger.lifecycle('IR validation dogfooding safety contract OK for {}: safety.ok={} safety.failed=0 entry.count={}',
                    reportSpec.name,
                    safetyOk,
                    entryCount)
            logger.lifecycle('IR validation dogfooding optimizer-readiness contract OK for {}: blocked={} readOnlyBlocked={} csePolicyBlocked={} cseLiteralPromotionBlocked={} autoVectorizationBlocked={} entry.count={}',
                    reportSpec.name,
                    optimizerBlocked,
                    optimizerReadOnlyBlocked,
                    csePolicyBlocked,
                    cseLiteralPromotionBlocked,
                    autoVectorizationBlocked,
                    entryCount)
            logger.lifecycle('IR validation dogfooding optimizer blocker summary for {}: sources={} families={}',
                    reportSpec.name,
                    countSummary(optimizerBlockerSourceCounts),
                    countSummary(optimizerBlockerFamilyCounts))
            logger.lifecycle('IR validation dogfooding production-readiness stage summary for {}: firstBlockingStages={}',
                    reportSpec.name,
                    countSummary(productionReadinessStageCounts))
            logger.lifecycle('IR validation dogfooding auto-vectorization no-candidate bucket summary for {}: firstBuckets={}',
                    reportSpec.name,
                    countSummary(autoVectorizationNoCandidateBucketCounts))
            logger.lifecycle('IR validation dogfooding auto-vectorization no-candidate diagnostic summary for {}: codes={}',
                    reportSpec.name,
                    countSummary(autoVectorizationNoCandidateDiagnosticCodeCounts))
        }
    }
}

tasks.register('validateIrValidationDogfoodingContractSelfTest') {
    group = 'verification'
    description = 'Verifies synthetic IR validation dogfooding contract failures for optimizer blocker fields.'

    doLast {
        Properties validReport = syntheticIrValidationContractReport()
        OptimizerReadinessContractResult validResult = validateOptimizerReadinessContract(validReport, 'synthetic-valid', 0)
        if (!validResult.blocked
                || validResult.optimizerBlockerSource != 'autoVectorization'
                || validResult.productionReadinessFirstBlockingStage != 'validationBundle') {
            throw new GradleException('Synthetic optimizer blocker contract baseline did not validate as expected')
        }

        syntheticOptimizerContractFailureScenarios().each { scenario ->
            expectOptimizerContractFailure(scenario.name, validReport, scenario.mutation)
        }

        Properties validBaseline = persistedIrValidationBaseline(validReport, 'synthetic-valid')
        validatePersistedIrValidationBaseline(validBaseline, validReport, 'synthetic-valid')
        syntheticPersistedBaselineFailureScenarios().each { scenario ->
            expectPersistedBaselineFailure(scenario.name, validBaseline, validReport, scenario.baselineMutation, scenario.currentMutation)
        }

        Properties validHealthSummary = irValidationHealthSummaryArtifact(['synthetic-valid': validReport])
        validateIrValidationHealthSummaryArtifact(validHealthSummary, 'synthetic-health-valid')
        syntheticHealthSummaryFailureScenarios().each { scenario ->
            expectHealthSummaryFailure(scenario.name, validHealthSummary, scenario.mutation)
        }

        logger.lifecycle('IR validation dogfooding contract self-test OK: optimizerBlocker and persisted baseline failures fail as expected')
    }
}

tasks.register('writeIrValidationExampleReportBaseline') {
    group = 'verification'
    description = 'Writes compact persisted IR validation optimizer baseline artifacts for dogfooding reports.'
    dependsOn tasks.named('validateIrValidationExampleReports')
    inputs.files(irValidationExampleReports.collect { it.reportFile })
    outputs.dir(irValidationBaselineDirectory)

    doLast {
        File baselineDir = irValidationBaselineDirectory.get().asFile
        baselineDir.mkdirs()
        irValidationExampleReports.each { reportSpec ->
            Properties report = loadIrValidationReport(reportSpec.reportFile.asFile, reportSpec.name)
            Properties baseline = persistedIrValidationBaseline(report, reportSpec.name)
            File baselineFile = new File(baselineDir, reportSpec.name + '-ir-validation-baseline.properties')
            baselineFile.withOutputStream { stream ->
                baseline.store(stream, 'JavaToGpu IR validation persisted optimizer baseline for ' + reportSpec.name)
            }
            logger.lifecycle('IR validation persisted baseline written for {}: {} entries -> {}',
                    reportSpec.name,
                    baseline.getProperty('entry.count'),
                    baselineFile)
            logger.lifecycle('IR validation persisted baseline trend for {}: {}',
                    reportSpec.name,
                    noCandidateTrendSummary(baseline, reportSpec.name + ' baseline'))
        }
    }
}

tasks.register('validateIrValidationExampleReportBaseline') {
    group = 'verification'
    description = 'Compares current dogfooding IR validation reports against persisted optimizer baselines.'
    dependsOn tasks.named('validateIrValidationExampleReports')
    mustRunAfter tasks.named('writeIrValidationExampleReportBaseline')
    inputs.files(irValidationExampleReports.collect { it.reportFile })
    inputs.dir(irValidationBaselineDirectory)

    doLast {
        File baselineDir = irValidationBaselineDirectory.get().asFile
        irValidationExampleReports.each { reportSpec ->
            File baselineFile = new File(baselineDir, reportSpec.name + '-ir-validation-baseline.properties')
            if (!baselineFile.isFile()) {
                throw new GradleException('Missing persisted IR validation baseline for ' + reportSpec.name
                        + ': ' + baselineFile + '. Run writeIrValidationExampleReportBaseline first.')
            }
            Properties current = loadIrValidationReport(reportSpec.reportFile.asFile, reportSpec.name)
            Properties baseline = new Properties()
            baselineFile.withInputStream { stream -> baseline.load(stream) }
            validatePersistedIrValidationBaseline(baseline, current, reportSpec.name)
            logger.lifecycle('IR validation persisted baseline OK for {}: {} entries compared from {}',
                    reportSpec.name,
                    current.getProperty('entry.count'),
                    baselineFile)
            logger.lifecycle('IR validation persisted baseline trend for {}: {}',
                    reportSpec.name,
                    noCandidateTrendSummary(current, reportSpec.name))
        }
    }
}

tasks.register('writeIrValidationHealthSummary') {
    group = 'verification'
    description = 'Writes a compact machine-readable health summary for current IR validation dogfooding reports.'
    dependsOn tasks.named('validateIrValidationExampleReports')
    inputs.files(irValidationExampleReports.collect { it.reportFile })
    outputs.file(irValidationHealthSummaryFile)

    doLast {
        Map<String, Properties> reportsByName = new LinkedHashMap<>()
        irValidationExampleReports.each { reportSpec ->
            reportsByName.put(reportSpec.name, loadIrValidationReport(reportSpec.reportFile.asFile, reportSpec.name))
        }
        Properties summary = irValidationHealthSummaryArtifact(reportsByName)
        validateIrValidationHealthSummaryArtifact(summary, 'writeIrValidationHealthSummary')

        File outputFile = irValidationHealthSummaryFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.withOutputStream { stream ->
            summary.store(stream, 'JavaToGpu IR validation health summary')
        }
        logger.lifecycle('IR validation health summary written: {}', outputFile)
        logger.lifecycle('IR validation health summary: {}', summary.getProperty('total.ciSummaryLine'))
    }
}

private static void incrementCount(Map<String, Integer> counts, String key) {
    if (key == null || key.isBlank() || key == 'none') {
        return
    }
    counts.put(key, counts.getOrDefault(key, 0) + 1)
}

private static void mergeCounts(Map<String, Integer> target, Map<String, Integer> source) {
    source.each { key, value -> target.put(key, target.getOrDefault(key, 0) + value) }
}

private static IrValidationHealthSummary irValidationHealthSummary(Properties report, String reportName) {
    int entryCount = parseReportInt(report, 'entry.count', reportName)
    int safetyOk = 0
    int safetyFailed = 0
    int optimizerBlocked = 0
    int readOnlyBlocked = 0
    Map<String, Integer> optimizerBlockerSourceCounts = new LinkedHashMap<>()
    Map<String, Integer> productionReadinessStageCounts = new LinkedHashMap<>()
    Map<String, Integer> noCandidateBucketCounts = new LinkedHashMap<>()
    Map<String, Integer> noCandidateDiagnosticCodeCounts = new LinkedHashMap<>()

    for (int index = 0; index < entryCount; index++) {
        String prefix = 'entry.' + index + '.'
        String safety = requireReportValue(report, prefix + 'safety', reportName)
        if (safety == 'ok') {
            safetyOk++
        } else if (safety == 'failed') {
            safetyFailed++
        } else {
            throw new GradleException('Unexpected IR validation safety state for ' + reportName
                    + ' entry ' + index + ': ' + safety)
        }

        String optimizerVerdict = requireReportValue(report, prefix + 'optimizerLayerReadinessVerdict', reportName)
        if (optimizerVerdict == 'blocked') {
            optimizerBlocked++
        }
        String csePolicyReadiness = requireReportValue(report, prefix + 'cseRewritePolicyReadiness', reportName)
        String blockingLayers = requireReportValue(report, prefix + 'optimizerLayerReadinessBlockingLayers', reportName)
        if (optimizerVerdict == 'blocked'
                && csePolicyReadiness != 'blockedBySkippedCandidate'
                && blockingLayers.contains('cseLiteralPromotion')
                && blockingLayers.contains('autoVectorization')) {
            readOnlyBlocked++
        }

        incrementCount(optimizerBlockerSourceCounts, requireReportValue(report, prefix + 'optimizerBlockerSource', reportName))
        incrementCount(productionReadinessStageCounts, requireReportValue(report, prefix + 'optimizerProductionReadinessFirstBlockingStage', reportName))
        incrementCount(noCandidateBucketCounts, requireReportValue(report, prefix + 'autoVectorizationNoCandidateFirstBucket', reportName))
        incrementCount(noCandidateDiagnosticCodeCounts, requireReportValue(report, prefix + 'autoVectorizationNoCandidateDiagnosticCode', reportName))
    }

    return new IrValidationHealthSummary(
            entryCount,
            safetyOk,
            safetyFailed,
            optimizerBlocked,
            readOnlyBlocked,
            optimizerBlockerSourceCounts,
            productionReadinessStageCounts,
            noCandidateBucketCounts,
            noCandidateDiagnosticCodeCounts
    )
}

private static Properties irValidationHealthSummaryArtifact(Map<String, Properties> reportsByName) {
    Properties summary = new Properties()
    summary.setProperty('format', 'javatogpu.ir.validation.health-summary.v1')
    summary.setProperty('report.count', Integer.toString(reportsByName.size()))

    int totalEntries = 0
    int totalSafetyOk = 0
    int totalSafetyFailed = 0
    int totalOptimizerBlocked = 0
    int totalReadOnlyBlocked = 0
    Map<String, Integer> totalBlockerSourceCounts = new LinkedHashMap<>()
    Map<String, Integer> totalProductionStageCounts = new LinkedHashMap<>()
    Map<String, Integer> totalNoCandidateBucketCounts = new LinkedHashMap<>()
    Map<String, Integer> totalNoCandidateDiagnosticCounts = new LinkedHashMap<>()

    int reportIndex = 0
    reportsByName.each { reportName, report ->
        IrValidationHealthSummary health = irValidationHealthSummary(report, reportName)
        String prefix = 'report.' + reportIndex + '.'
        summary.setProperty(prefix + 'name', reportName)
        summary.setProperty(prefix + 'entries', Integer.toString(health.entries))
        summary.setProperty(prefix + 'safetyOk', Integer.toString(health.safetyOk))
        summary.setProperty(prefix + 'safetyFailed', Integer.toString(health.safetyFailed))
        summary.setProperty(prefix + 'optimizerBlocked', Integer.toString(health.optimizerBlocked))
        summary.setProperty(prefix + 'readOnlyBlocked', Integer.toString(health.readOnlyBlocked))
        summary.setProperty(prefix + 'optimizerBlockerSources', countSummary(health.optimizerBlockerSourceCounts))
        summary.setProperty(prefix + 'productionReadinessStages', countSummary(health.productionReadinessStageCounts))
        summary.setProperty(prefix + 'noCandidateBuckets', countSummary(health.noCandidateBucketCounts))
        summary.setProperty(prefix + 'noCandidateDiagnosticCodes', countSummary(health.noCandidateDiagnosticCodeCounts))
        summary.setProperty(prefix + 'ciSummaryLine', health.ciSummaryLine(reportName))

        totalEntries += health.entries
        totalSafetyOk += health.safetyOk
        totalSafetyFailed += health.safetyFailed
        totalOptimizerBlocked += health.optimizerBlocked
        totalReadOnlyBlocked += health.readOnlyBlocked
        mergeCounts(totalBlockerSourceCounts, health.optimizerBlockerSourceCounts)
        mergeCounts(totalProductionStageCounts, health.productionReadinessStageCounts)
        mergeCounts(totalNoCandidateBucketCounts, health.noCandidateBucketCounts)
        mergeCounts(totalNoCandidateDiagnosticCounts, health.noCandidateDiagnosticCodeCounts)
        reportIndex++
    }

    summary.setProperty('total.entries', Integer.toString(totalEntries))
    summary.setProperty('total.safetyOk', Integer.toString(totalSafetyOk))
    summary.setProperty('total.safetyFailed', Integer.toString(totalSafetyFailed))
    summary.setProperty('total.optimizerBlocked', Integer.toString(totalOptimizerBlocked))
    summary.setProperty('total.readOnlyBlocked', Integer.toString(totalReadOnlyBlocked))
    summary.setProperty('total.optimizerBlockerSources', countSummary(totalBlockerSourceCounts))
    summary.setProperty('total.productionReadinessStages', countSummary(totalProductionStageCounts))
    summary.setProperty('total.noCandidateBuckets', countSummary(totalNoCandidateBucketCounts))
    summary.setProperty('total.noCandidateDiagnosticCodes', countSummary(totalNoCandidateDiagnosticCounts))
    summary.setProperty(
            'total.ciSummaryLine',
            'irValidationHealth reports=' + reportsByName.size()
                    + ' entries=' + totalEntries
                    + ' safetyFailed=' + totalSafetyFailed
                    + ' optimizerBlocked=' + totalOptimizerBlocked
                    + ' readOnlyBlocked=' + totalReadOnlyBlocked
                    + ' diagnosticCodes=' + countSummary(totalNoCandidateDiagnosticCounts)
                    + ' firstBuckets=' + countSummary(totalNoCandidateBucketCounts)
    )
    return summary
}

private static void validateIrValidationHealthSummaryArtifact(Properties summary, String reportName) {
    if (summary.getProperty('format') != 'javatogpu.ir.validation.health-summary.v1') {
        throw new GradleException('Unexpected IR validation health summary format for ' + reportName
                + ': ' + summary.getProperty('format'))
    }
    int reportCount = parseReportInt(summary, 'report.count', reportName)
    if (reportCount <= 0) {
        throw new GradleException('IR validation health summary must contain at least one report for ' + reportName)
    }
    parseReportInt(summary, 'total.entries', reportName)
    parseReportInt(summary, 'total.safetyOk', reportName)
    parseReportInt(summary, 'total.safetyFailed', reportName)
    parseReportInt(summary, 'total.optimizerBlocked', reportName)
    parseReportInt(summary, 'total.readOnlyBlocked', reportName)
    requireReportValue(summary, 'total.optimizerBlockerSources', reportName)
    requireReportValue(summary, 'total.productionReadinessStages', reportName)
    requireReportValue(summary, 'total.noCandidateBuckets', reportName)
    requireReportValue(summary, 'total.noCandidateDiagnosticCodes', reportName)
    String totalSummaryLine = requireReportValue(summary, 'total.ciSummaryLine', reportName)
    if (!totalSummaryLine.contains('irValidationHealth reports=' + reportCount)
            || !totalSummaryLine.contains('diagnosticCodes=')
            || !totalSummaryLine.contains('firstBuckets=')) {
        throw new GradleException('IR validation health summary total CI line is incomplete for ' + reportName
                + ': ' + totalSummaryLine)
    }

    for (int index = 0; index < reportCount; index++) {
        String prefix = 'report.' + index + '.'
        String name = requireReportValue(summary, prefix + 'name', reportName)
        parseReportInt(summary, prefix + 'entries', reportName)
        parseReportInt(summary, prefix + 'safetyOk', reportName)
        parseReportInt(summary, prefix + 'safetyFailed', reportName)
        parseReportInt(summary, prefix + 'optimizerBlocked', reportName)
        parseReportInt(summary, prefix + 'readOnlyBlocked', reportName)
        requireReportValue(summary, prefix + 'optimizerBlockerSources', reportName)
        requireReportValue(summary, prefix + 'productionReadinessStages', reportName)
        requireReportValue(summary, prefix + 'noCandidateBuckets', reportName)
        requireReportValue(summary, prefix + 'noCandidateDiagnosticCodes', reportName)
        String reportSummaryLine = requireReportValue(summary, prefix + 'ciSummaryLine', reportName)
        if (!reportSummaryLine.contains('irValidationHealth report=' + name)
                || !reportSummaryLine.contains('diagnosticCodes=')
                || !reportSummaryLine.contains('firstBuckets=')) {
            throw new GradleException('IR validation health summary report CI line is incomplete for '
                    + reportName + ' entry ' + index + ': ' + reportSummaryLine)
        }
    }
}

private static List<Map<String, Object>> syntheticHealthSummaryFailureScenarios() {
    return [
            [
                    name    : 'synthetic-health-missing-total-summary-line',
                    mutation: { Properties summary -> summary.remove('total.ciSummaryLine') }
            ],
            [
                    name    : 'synthetic-health-missing-total-buckets',
                    mutation: { Properties summary -> summary.remove('total.noCandidateBuckets') }
            ],
            [
                    name    : 'synthetic-health-missing-total-diagnostic-codes',
                    mutation: { Properties summary -> summary.remove('total.noCandidateDiagnosticCodes') }
            ],
            [
                    name    : 'synthetic-health-missing-report-summary-line',
                    mutation: { Properties summary -> summary.remove('report.0.ciSummaryLine') }
            ]
    ]
}

private static void expectHealthSummaryFailure(String scenario, Properties baseline, Closure mutation) {
    Properties summary = new Properties()
    summary.putAll(baseline)
    mutation.call(summary)
    try {
        validateIrValidationHealthSummaryArtifact(summary, scenario)
    } catch (GradleException expected) {
        return
    }
    throw new GradleException('Synthetic IR validation health summary scenario unexpectedly passed: ' + scenario)
}

private static void validateAutoVectorizationNoCandidateDiagnosticCodeRollup(
        Properties report,
        String reportName,
        Map<String, Integer> expectedCounts
) {
    String expectedSummary = countSummary(expectedCounts)
    String actualSummary = requireReportValue(
            report,
            'autoVectorizationNoCandidateDiagnosticCodeCounts',
            reportName
    )
    if (actualSummary != expectedSummary) {
        throw new GradleException('Auto-vectorization no-candidate diagnostic-code summary drifted for '
                + reportName + ': expected=' + expectedSummary + ' actual=' + actualSummary)
    }

    int uniqueCodes = parseReportInt(report, 'autoVectorizationNoCandidateUniqueDiagnosticCodes', reportName)
    if (uniqueCodes != expectedCounts.size()) {
        throw new GradleException('Auto-vectorization no-candidate diagnostic-code unique count drifted for '
                + reportName + ': expected=' + expectedCounts.size() + ' actual=' + uniqueCodes)
    }

    expectedCounts.each { code, expectedCount ->
        int actualCount = parseReportInt(report, 'autoVectorizationNoCandidateDiagnosticCode.' + code, reportName)
        if (actualCount != expectedCount) {
            throw new GradleException('Auto-vectorization no-candidate diagnostic-code count drifted for '
                    + reportName + ' code=' + code + ': expected=' + expectedCount + ' actual=' + actualCount)
        }
    }
}

private static Properties loadIrValidationReport(File reportFile, String reportName) {
    if (!reportFile.isFile()) {
        throw new GradleException('Missing IR validation dogfooding report for ' + reportName + ': ' + reportFile)
    }
    Properties report = new Properties()
    reportFile.withInputStream { stream -> report.load(stream) }
    if (report.getProperty('format') != 'javatogpu.ir.validation.v1') {
        throw new GradleException('Unexpected IR validation report format for ' + reportName + ': '
                + report.getProperty('format'))
    }
    return report
}

private static Properties persistedIrValidationBaseline(Properties report, String reportName) {
    Properties baseline = new Properties()
    int entryCount = parseReportInt(report, 'entry.count', reportName)
    baseline.setProperty('format', 'javatogpu.ir.validation.persisted-baseline.v1')
    baseline.setProperty('sourceFormat', requireReportValue(report, 'format', reportName))
    baseline.setProperty('entry.count', Integer.toString(entryCount))
    copyRequiredBaselineField(report, baseline, reportName, '', 'autoVectorizationNoCandidateBucketCounts')
    copyRequiredBaselineField(report, baseline, reportName, '', 'autoVectorizationNoCandidateUniqueBuckets')
    copyCountFields(report, baseline, 'autoVectorizationNoCandidateBucket.')
    copyRequiredBaselineField(report, baseline, reportName, '', 'autoVectorizationNoCandidateDiagnosticCodeCounts')
    copyRequiredBaselineField(report, baseline, reportName, '', 'autoVectorizationNoCandidateUniqueDiagnosticCodes')
    copyCountFields(report, baseline, 'autoVectorizationNoCandidateDiagnosticCode.')
    for (int index = 0; index < entryCount; index++) {
        String prefix = 'entry.' + index + '.'
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'methodName')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerLayerReadinessBaselineCiOutcome')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerLayerReadinessBaselineCiDecision')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerLayerReadinessBaselineCiFailBuild')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineSnapshotVerdict')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineSnapshotSource')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineSnapshotFamily')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineSnapshotRemainingWork')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonOutcome')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonBaselineScore')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonCurrentScore')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonScoreDelta')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonSourceTransition')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonFamilyTransition')
        copyRequiredBaselineField(report, baseline, reportName, prefix, 'optimizerBlockerBaselineComparisonRemainingWorkTransition')
    }
    return baseline
}

private static void copyCountFields(Properties source, Properties target, String prefix) {
    source.stringPropertyNames()
            .findAll { key -> key.startsWith(prefix) }
            .sort()
            .each { key -> target.setProperty(key, source.getProperty(key)) }
}

private static void copyRequiredBaselineField(
        Properties source,
        Properties target,
        String reportName,
        String prefix,
        String key
) {
    target.setProperty(prefix + key, requireReportValue(source, prefix + key, reportName))
}

private static List<Map<String, Object>> syntheticPersistedBaselineFailureScenarios() {
    return [
            [
                    name            : 'synthetic-persisted-method-mismatch',
                    baselineMutation: { Properties baseline -> baseline.setProperty('entry.0.methodName', 'oldSyntheticKernel') },
                    currentMutation : { Properties current -> }
            ],
            [
                    name            : 'synthetic-persisted-blocker-source-change',
                    baselineMutation: { Properties baseline -> baseline.setProperty('entry.0.optimizerBlockerBaselineSnapshotSource', 'cseRewritePolicy') },
                    currentMutation : { Properties current -> }
            ],
            [
                    name            : 'synthetic-persisted-readiness-regression',
                    baselineMutation: { Properties baseline -> },
