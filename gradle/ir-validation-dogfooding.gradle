private static void expectPersistedBaselineFailure(
        String scenario,
        Properties baselineTemplate,
        Properties currentTemplate,
        Closure baselineMutation,
        Closure currentMutation
) {
    Properties baseline = new Properties()
    baseline.putAll(baselineTemplate)
    Properties current = new Properties()
    current.putAll(currentTemplate)
    baselineMutation.call(baseline)
    currentMutation.call(current)
    try {
        validatePersistedIrValidationBaseline(baseline, current, scenario)
    } catch (GradleException expected) {
        return
    }
    throw new GradleException('Synthetic persisted IR validation baseline scenario unexpectedly passed: ' + scenario)
}

private static void validatePersistedIrValidationBaseline(
        Properties baseline,
        Properties current,
        String reportName
) {
    if (baseline.getProperty('format') != 'javatogpu.ir.validation.persisted-baseline.v1') {
        throw new GradleException('Unexpected persisted IR validation baseline format for ' + reportName + ': '
                + baseline.getProperty('format'))
    }
    int baselineEntryCount = parseReportInt(baseline, 'entry.count', reportName + ' baseline')
    int currentEntryCount = parseReportInt(current, 'entry.count', reportName)
    if (baselineEntryCount != currentEntryCount) {
        throw new GradleException('IR validation persisted baseline entry count changed for ' + reportName
                + ': baseline=' + baselineEntryCount + ' current=' + currentEntryCount)
    }
    comparePersistedReportField(baseline, current, reportName, 'autoVectorizationNoCandidateBucketCounts')
    comparePersistedReportField(baseline, current, reportName, 'autoVectorizationNoCandidateUniqueBuckets')
    comparePersistedCountFields(baseline, current, reportName, 'autoVectorizationNoCandidateBucket.', 'bucket')
    comparePersistedReportField(baseline, current, reportName, 'autoVectorizationNoCandidateDiagnosticCodeCounts')
    comparePersistedReportField(baseline, current, reportName, 'autoVectorizationNoCandidateUniqueDiagnosticCodes')
    comparePersistedCountFields(baseline, current, reportName, 'autoVectorizationNoCandidateDiagnosticCode.', 'diagnostic-code')
    for (int index = 0; index < currentEntryCount; index++) {
        String prefix = 'entry.' + index + '.'
        String baselineMethod = requireReportValue(baseline, prefix + 'methodName', reportName + ' baseline')
        String currentMethod = requireReportValue(current, prefix + 'methodName', reportName)
        if (baselineMethod != currentMethod) {
            throw new GradleException('IR validation persisted baseline method changed for ' + reportName
                    + ' entry ' + index + ': baseline=' + baselineMethod + ' current=' + currentMethod)
        }
        String readinessOutcome = requireReportValue(current, prefix + 'optimizerLayerReadinessBaselineCiOutcome', reportName)
        String readinessDecision = requireReportValue(current, prefix + 'optimizerLayerReadinessBaselineCiDecision', reportName)
        String readinessFailBuild = requireReportValue(current, prefix + 'optimizerLayerReadinessBaselineCiFailBuild', reportName)
        String blockerOutcome = requireReportValue(current, prefix + 'optimizerBlockerBaselineComparisonOutcome', reportName)
        int blockerScoreDelta = parseReportInt(current, prefix + 'optimizerBlockerBaselineComparisonScoreDelta', reportName)
        if (readinessOutcome == 'regressed' || readinessDecision == 'fail/regressionDetected' || readinessFailBuild == 'true') {
            throw new GradleException('IR validation persisted readiness baseline regressed for ' + reportName
                    + ' entry ' + index + ' (' + currentMethod + '): outcome=' + readinessOutcome
                    + ' decision=' + readinessDecision + ' failBuild=' + readinessFailBuild)
        }
        if (blockerOutcome == 'regressed' || blockerScoreDelta < 0) {
            throw new GradleException('IR validation persisted blocker baseline regressed for ' + reportName
                    + ' entry ' + index + ' (' + currentMethod + '): outcome=' + blockerOutcome
                    + ' scoreDelta=' + blockerScoreDelta)
        }
        comparePersistedBaselineField(baseline, current, reportName, index, prefix, 'optimizerBlockerBaselineSnapshotSource')
        comparePersistedBaselineField(baseline, current, reportName, index, prefix, 'optimizerBlockerBaselineSnapshotFamily')
        comparePersistedBaselineField(baseline, current, reportName, index, prefix, 'optimizerBlockerBaselineSnapshotRemainingWork')
    }
}

private static void comparePersistedCountFields(
        Properties baseline,
        Properties current,
        String reportName,
        String prefix,
        String label
) {
    Set<String> baselineKeys = countKeys(baseline, prefix)
    Set<String> currentKeys = countKeys(current, prefix)
    if (baselineKeys != currentKeys) {
        throw new GradleException('IR validation persisted ' + label + ' keys changed for ' + reportName
                + ': baseline=' + baselineKeys + ' current=' + currentKeys)
    }
    baselineKeys.each { key -> comparePersistedReportField(baseline, current, reportName, key) }
}

private static Set<String> countKeys(Properties report, String prefix) {
    return new TreeSet<>(report.stringPropertyNames()
            .findAll { key -> key.startsWith(prefix) })
}

private static void comparePersistedReportField(
        Properties baseline,
        Properties current,
        String reportName,
        String key
) {
    String baselineValue = requireReportValue(baseline, key, reportName + ' baseline')
    String currentValue = requireReportValue(current, key, reportName)
    if (baselineValue != currentValue) {
        throw new GradleException('IR validation persisted baseline field changed for ' + reportName
                + ' key=' + key + ': baseline=' + baselineValue + ' current=' + currentValue)
    }
}

private static void comparePersistedBaselineField(
        Properties baseline,
        Properties current,
        String reportName,
        int index,
        String prefix,
        String key
) {
    String baselineValue = requireReportValue(baseline, prefix + key, reportName + ' baseline')
    String currentValue = requireReportValue(current, prefix + key, reportName)
    if (baselineValue != currentValue) {
        throw new GradleException('IR validation persisted baseline field changed for ' + reportName
                + ' entry ' + index + ' key=' + key + ': baseline=' + baselineValue + ' current=' + currentValue)
    }
}

private static String countSummary(Map<String, Integer> counts) {
    if (counts.isEmpty()) {
        return '{}'
    }
    return '{' + counts.collect { key, value -> key + '=' + value }.join(',') + '}'
}

private static String noCandidateTrendSummary(Properties report, String reportName) {
    return 'diagnosticCodes=' + requireReportValue(
            report,
            'autoVectorizationNoCandidateDiagnosticCodeCounts',
            reportName
    ) + ' firstBuckets=' + requireReportValue(
            report,
            'autoVectorizationNoCandidateBucketCounts',
            reportName
    )
}

