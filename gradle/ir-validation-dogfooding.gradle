private static void expectOptimizerContractFailure(
        String scenario,
        Properties baseline,
        Closure mutation
) {
    Properties report = new Properties()
    report.putAll(baseline)
    mutation.call(report)
    try {
        validateOptimizerReadinessContract(report, scenario, 0)
        Map<String, Integer> diagnosticCodeCounts = new LinkedHashMap<>()
        incrementCount(diagnosticCodeCounts, report.getProperty('entry.0.autoVectorizationNoCandidateDiagnosticCode'))
        validateAutoVectorizationNoCandidateDiagnosticCodeRollup(report, scenario, diagnosticCodeCounts)
    } catch (GradleException expected) {
        return
    }
    throw new GradleException('Synthetic optimizer blocker contract scenario unexpectedly passed: ' + scenario)
}

private static int parseReportInt(Properties report, String key, String reportName) {
    String value = report.getProperty(key)
    if (value == null || value.isBlank()) {
        throw new GradleException('Missing IR validation report key for ' + reportName + ': ' + key)
    }
    try {
        return Integer.parseInt(value)
    } catch (NumberFormatException exception) {
        throw new GradleException('Invalid integer IR validation report key for ' + reportName + ': ' + key + '=' + value, exception)
    }
}

