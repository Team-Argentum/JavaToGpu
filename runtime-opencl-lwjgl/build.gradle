description = 'OpenCL backend of the runtime over LWJGL (lwjgl-opencl, Java 17). The application provides LWJGL core and its natives.'

// Версия ядра LWJGL (LWJGL_VERSION в корневом build.gradle) - та, что у Minecraft 1.21.1. lwjgl-opencl должен
// совпадать с ядром приложения по версии, поэтому ядро - compileOnly (его даёт приложение), а lwjgl-opencl - обычная
// зависимость, которую мод может заменить своей версией.
def LWJGL_VERSION = rootProject.ext.LWJGL_VERSION
def lwjglNatives = rootProject.ext.LWJGL_NATIVES

dependencies {
    api project(':runtime')
    compileOnly "org.lwjgl:lwjgl:${LWJGL_VERSION}"
    implementation "org.lwjgl:lwjgl-opencl:${LWJGL_VERSION}"

    // тестам нужно само ядро LWJGL с нативами (в Minecraft его даёт игра)
    testImplementation "org.lwjgl:lwjgl:${LWJGL_VERSION}"
    testRuntimeOnly "org.lwjgl:lwjgl:${LWJGL_VERSION}:${lwjglNatives}"
    testImplementation testFixtures(project(':ir'))
    testImplementation testFixtures(project(':ir-interpreter'))
    testImplementation project(':ir-interpreter')
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'device'
    }
}

// Тесты на настоящем OpenCL-устройстве через LWJGL. Без драйвера пропускаются (Assumptions).
tasks.register('deviceTest', Test) {
    group = 'verification'
    description = 'Runtime tests on a real OpenCL device through the LWJGL backend (tag device).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'device'
    }
    testLogging {
        showStandardStreams = true
    }
    shouldRunAfter tasks.named('test')
}

// Проверка на JVM 17 (FRONTEND_ASM_RUNTIME.md, S8, шаг B6): путь мода на Java 17 - frontend-asm, ClProgram и
// GpuContext.compileProgram через LWJGL - собирается с --release 17 и запускается на JDK 17 (toolchain). Тесты модулей
// собираются под 25 и на 17 не запускаются, поэтому совместимость Java-17-модулей проверяет эта программа.
// Без устройства запуск ядер пропускается; -PsmokeRequireDevice=true делает это ошибкой.
sourceSets {
    jdk17Smoke
}

dependencies {
    jdk17SmokeImplementation sourceSets.main.output
    jdk17SmokeImplementation project(':runtime')
    jdk17SmokeImplementation project(':frontend-asm')
    jdk17SmokeImplementation "org.lwjgl:lwjgl:${LWJGL_VERSION}"
    jdk17SmokeImplementation "org.lwjgl:lwjgl-opencl:${LWJGL_VERSION}"
    jdk17SmokeRuntimeOnly "org.lwjgl:lwjgl:${LWJGL_VERSION}:${lwjglNatives}"
}

tasks.named('compileJdk17SmokeJava', JavaCompile) {
    options.release = 17
}

tasks.register('jdk17Smoke', JavaExec) {
    group = 'verification'
    description = 'Runs frontend-asm, ClProgram and GpuContext.compileProgram (LWJGL backend) on a JDK 17 launcher.'
    classpath = sourceSets.jdk17Smoke.runtimeClasspath
    mainClass = 'com.sixik.gpu.smoke.Jdk17Smoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    systemProperty 'smoke.expectJava', '17'
    systemProperty 'smoke.requireDevice', findProperty('smokeRequireDevice') ?: 'false'
}
