plugins {
    id 'application'
    id 'io.github.deussixik.javatogpu' version '0.2.0-SNAPSHOT'
}

repositories {
    maven { url = providers.gradleProperty('gpuRepository').getOrElse('../../build/local-maven') }
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

application {
    mainClass = 'demo.Main'
    // Плагин настраивает Test/JavaExec; готовым скриптам installDist аргумент нужен отдельно.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    testImplementation 'io.github.deussixik:test-support:0.2.0-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runFallback', JavaExec) {
    group = 'verification'
    description = 'Runs an ordinary kernel call with all devices excluded; requires JVM fallback.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'fallback'
}

tasks.register('runDevice', JavaExec) {
    group = 'verification'
    description = 'Runs an ordinary kernel call with fallback forbidden; fails if no OpenCL device is available.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args 'device'
}
