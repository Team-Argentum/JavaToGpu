// Toolchain JDK 25 (и 17 для jdk17Smoke) скачивается, если его нет на машине: так собирает JitPack (jitpack.yml).
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Модули и их допустимые зависимости описаны в REWORK_ARCHITECTURE.md, раздел 11.
// Граф проверяется задачей verifyModuleBoundaries (см. build.gradle).
rootProject.name = 'gpu'

include 'api'              // аннотации, типы, builtins (генерируются). Без нативов.
include 'ir'               // плоский IR (SoA), типы, сериализация, валидатор. 0 зависимостей.
include 'ir-optimizer'     // оптимизатор IR: DCE, математика, давление на регистры, разбиение ядер. Зависит только от ir.
include 'ir-interpreter'   // эталонный CPU-интерпретатор IR (для тестов и конформанса).
include 'codegen-opencl'   // IR -> OpenCL C. Чистая функция.
include 'runtime'          // GpuContext, устройства, буферы, кэш, запуск, JVM-fallback. Java 17, без FFM.
include 'runtime-opencl-ffm'   // бэкенд драйвера OpenCL через FFM (Java 25).
include 'runtime-opencl-lwjgl' // бэкенд драйвера OpenCL через LWJGL (Java 17, Minecraft 1.18-1.21.x).
include 'frontend-common'  // общий код фронтендов: атрибуты ядра, таблица диагностик, формат ресурсов.
include 'frontend-java'    // javac Tree API + annotation processor -> пишет IR.
include 'frontend-asm'     // байткод (ASM tree API) -> тот же IR, что у frontend-java (раздел 17).
include 'weaver'           // подмена тела @Kernel-метода (ASM, post-compile).
include 'gradle-plugin'    // тонкая обёртка над weaver для Gradle.
include 'test-support'     // JUnit 5/6: GpuAssert, @GPUTest, KernelSample.
include 'tools'            // дампы IR, CI-отчёты. Не входит в production-артефакт.
include 'app'              // тестовое приложение: примеры ядер, запуск и интеграционные тесты.
