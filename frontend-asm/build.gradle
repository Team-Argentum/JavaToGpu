description = 'Bytecode frontend: reads class files (ASM tree API) and builds the same IR as frontend-java.'

// Версия ASM. Загрузчики модов дают свою (решение 18.6-7: NeoForge/Fabric - 9.7+), поэтому нижняя граница
// проверяется прогоном тестов с -PasmVersion=9.7: версия задаётся принудительно для всех конфигураций модуля,
// включая ASM, который приходит транзитивно (weaver в тестах).
def asmVersion = findProperty('asmVersion') ?: '9.11.1'
if (findProperty('asmVersion') != null) {
    configurations.configureEach {
        resolutionStrategy.eachDependency { d ->
            if (d.requested.group == 'org.ow2.asm') {
                d.useVersion(asmVersion)
            }
        }
    }
}

// Корпус тестов под ASM загрузчика: ASM 9.7 читает class-файлы до Java 23, поэтому с -PasmVersion корпус (образцы
// ir-interpreter и исходники, которые тесты компилируют javac в памяти) собирается с --release 21 - как библиотека мода
// 1.21.1. Сами тесты остаются под 25 (зависят от модулей Java 25) и в корпус не входят. Без свойства корпус - Java 25.
def corpusRelease = findProperty('asmVersion') != null ? 21 : null
if (corpusRelease != null) {
    evaluationDependsOn(':ir-interpreter')
    project(':ir-interpreter').tasks.named('compileTestFixturesJava', JavaCompile) {
        options.release = corpusRelease
    }
}

dependencies {
    // типы публичного API (IrModule, KernelResources.IndexEntry в AsmFrontend.Kernel) - api, а не implementation
    api project(':ir')
    // шаблон @Reduction проверяется тем же кодом, которым рантайм строит параллельное ядро (как у frontend-java)
    implementation project(':ir-optimizer')
    // compilationProperties, атрибуты ядра, таблица диагностик, формат ресурсов - общий код с frontend-java (17.2)
    api project(':frontend-common')
    implementation "org.ow2.asm:asm:${asmVersion}"
    implementation "org.ow2.asm:asm-tree:${asmVersion}"
    // asm-analysis не нужен: источники значений стека при синтезе LVT считает свой StackSources (B7) - кадры ASM Analyzer
    // квадратичны по памяти на методах роутера, а лимиты ASM 9.11 зависят от версии загрузчика

    // Только тесты: корпус образцов (class-файлы с IR от frontend-java в ресурсах), дамп IR и интерпретатор для
    // сравнения IR_asm с IR_java по тексту и по поведению (критерий 17.14).
    testImplementation testFixtures(project(':ir-interpreter'))
    testImplementation project(':ir-interpreter')
    testImplementation project(':tools')
    testImplementation project(':api')
    // A4 (17.15): образцы с device-функциями компилируются javac в памяти вместе с процессором frontend-java - один
    // проход даёт и class-файлы (вход frontend-asm), и IR_java для сравнения
    testImplementation project(':frontend-java')
    // A5: примеры (examples/) - часть корпуса 17.14-1; их исходники обращаются к рантайму (JavaToGpu, GpuContext)
    testImplementation project(':runtime')
    testRuntimeOnly project(':runtime-opencl-ffm')
    // A6: файловая обёртка проверяется вместе с weaver'ом (второй проход по сплетённым классам)
    testImplementation project(':weaver')
}

tasks.named('test') {
    // classpath образцов задаётся явно, а не берётся из java.class.path воркера (как в frontend-java)
    systemProperty 'gpu.test.classpath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'gpu.examples.dir', rootProject.file('examples').absolutePath
    if (corpusRelease != null) {
        systemProperty 'gpu.test.release', corpusRelease.toString()
    }
    // замер масштаба B0 (ScaleProbeTest): -Dprobe.scale=true прогоняет всю шкалу
    System.properties.findAll { it.key.toString().startsWith('probe.') }.each { k, v -> systemProperty k.toString(), v }
    // профиль замера: -Dprobe.jfr=<файл.jfr>
    if (System.getProperty('probe.jfr') != null) {
        jvmArgs "-XX:StartFlightRecording=filename=${System.getProperty('probe.jfr')},settings=profile"
    }
    testLogging {
        showStandardStreams = Boolean.getBoolean('probe.scale') || System.getProperty('probe.sizes') != null
    }
    inputs.dir(rootProject.file('examples/tour/src/main/java'))
    inputs.dir(rootProject.file('examples/standalone/src/main/java'))
}
